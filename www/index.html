<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no">
<title>Sổ Ăn Thắng</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&display=swap" rel="stylesheet">

<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#034694">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Sổ Ăn Thắng">

<style>:root{
  --bg:#eef2f9;
  --card:#ffffff;
  --text:#0b1a33;
  --text-dim:#5b6b85;
  --border:#dce3f0;
  --primary:#034694;
  --primary-dark:#021b3f;
  --primary-dim:#dce8fb;
  --secondary:#5b6b85;
  --secondary-dark:#2b3240;
  --secondary-dim:#e7eaef;
  --gold:#c8a94a;
  --green:#1a9e4e;
  --green-dim:#e4f7ea;
  --red:#e8402a;
  --red-dim:#fde6e1;
  --amber:#b8860b;
  --amber-dim:#fdf5e6;
  --radius:16px;
  --shadow:0 1px 3px rgba(3,20,50,.08), 0 1px 2px rgba(3,20,50,.05);
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#0a1322;
    --card:#111b2e;
    --text:#eef3fb;
    --text-dim:#8a97ad;
    --border:#1f2c42;
    --primary:#2f6fd1;
    --primary-dark:#082a61;
    --primary-dim:#132544;
    --secondary:#9aa7b8;
    --secondary-dark:#4a5568;
    --secondary-dim:#1b2435;
    --gold:#e0c164;
    --green:#3ecf79;
    --green-dim:#123420;
    --red:#ff6b55;
    --red-dim:#3a1612;
    --amber:#e2b33d;
    --amber-dim:#3a2f10;
    --shadow:0 2px 6px rgba(0,0,0,.5);
  }
}
*{box-sizing:border-box;}
html,body{height:100%;}
body{
  margin:0;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  background:var(--bg);
  color:var(--text);
  -webkit-tap-highlight-color:transparent;
}
h1,h2,h3,.btn,.tab-btn,.topbar-title,.day-label,.modal-header h3,.fab,.section-title{
  font-family:"Baloo 2",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
}
#app{
  display:flex;
  flex-direction:column;
  height:100vh;
  max-width:560px;
  margin:0 auto;
  background:
    repeating-linear-gradient(100deg, rgba(3,70,148,.035) 0 60px, rgba(3,70,148,0) 60px 120px),
    var(--bg);
  position:relative;
}

/* ===== Header: stadium floodlight banner ===== */
.topbar{
  flex:0 0 auto;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:16px 16px;
  background:
    radial-gradient(140px 70px at 88% -25%, rgba(255,255,255,.28), transparent 70%),
    repeating-linear-gradient(115deg, rgba(255,255,255,.05) 0 10px, rgba(255,255,255,0) 10px 26px),
    linear-gradient(115deg, var(--primary) 0%, #0a5bc4 55%, var(--primary-dark) 100%);
  box-shadow:0 3px 14px rgba(3,30,70,.35);
  position:relative;
  overflow:hidden;
  z-index:5;
  border-bottom:3px solid var(--gold);
}
.topbar-title{
  display:flex;
  align-items:center;
  gap:9px;
  font-size:21px;
  font-weight:800;
  color:#fff;
  text-shadow:0 1px 0 rgba(0,0,0,.25);
  letter-spacing:.2px;
}
.topbar-title .logo{
  font-size:24px;
  filter:drop-shadow(0 2px 2px rgba(0,0,0,.3));
}
.icon-btn{
  border:none;
  background:rgba(255,255,255,.2);
  width:40px;height:40px;
  border-radius:12px;
  font-size:18px;
  display:flex;align-items:center;justify-content:center;
  cursor:pointer;
  color:#fff;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.35), 0 2px 0 rgba(0,0,0,.15);
  transition:transform .08s;
}
.icon-btn:active{transform:translateY(2px) scale(.96);}

.view{
  flex:1 1 auto;
  overflow-y:auto;
  padding:14px 14px 92px;
}

/* ===== Tab bar ===== */
.tabbar{
  position:fixed;
  bottom:0;left:0;right:0;
  max-width:560px;
  margin:0 auto;
  display:flex;
  background:var(--card);
  border-top:1px solid var(--border);
  padding-bottom:env(safe-area-inset-bottom);
  box-shadow:0 -2px 10px rgba(0,0,0,.05);
}
.tab-btn{
  flex:1;
  border:none;
  background:none;
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:3px;
  padding:9px 2px 10px;
  color:var(--text-dim);
  font-size:11px;
  font-weight:600;
  cursor:pointer;
  position:relative;
  transition:transform .12s;
}
.tab-btn .tab-ic{font-size:20px;transition:transform .15s;}
.tab-btn.active{color:var(--primary);}
.tab-btn.active .tab-ic{transform:translateY(-1px) scale(1.12);}
.tab-btn.active::after{
  content:"";
  position:absolute;
  top:1px;
  width:22px;height:3px;
  border-radius:3px;
  background:linear-gradient(90deg, var(--gold), var(--primary));
  box-shadow:0 0 6px var(--gold);
}
.tab-btn:active{transform:scale(.92);}

h1,h2,h3{margin:0 0 10px;}
.section-title{
  font-size:13px;
  font-weight:700;
  color:var(--text-dim);
  letter-spacing:.02em;
  margin:20px 2px 9px;
}
.section-title:first-child{margin-top:2px;}
.section-title-row{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin:20px 2px 9px;
}
.section-title-row .section-title{margin:0;}
.btn-sm{
  font-size:12px;
  padding:5px 11px;
  border-radius:8px;
  font-weight:600;
}

.card{
  background:var(--card);
  border-radius:var(--radius);
  box-shadow:var(--shadow);
  padding:16px;
  margin-bottom:12px;
  border:1px solid var(--border);
}
.card-row{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
}
.card-row .btn{flex:0 0 auto;white-space:nowrap;}
.card-row > div{flex:1;min-width:0;text-align:center;}

.stat-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
  margin-bottom:4px;
}
.stat-card{
  background:var(--card);
  border-radius:var(--radius);
  box-shadow:var(--shadow);
  padding:14px;
  border:1px solid var(--border);
}
.stat-card .label{font-size:12px;color:var(--text-dim);margin-bottom:4px;}
.stat-card .value{font-size:19px;font-weight:800;}
.stat-card.wide{
  grid-column:1/-1;
  position:relative;
  overflow:hidden;
}
.stat-card.wide.pos{
  border-color:var(--green);
  background:
    radial-gradient(160px 90px at 100% 0%, color-mix(in srgb, var(--green) 14%, var(--card)), transparent 70%),
    var(--card);
}
.stat-card.wide.neg{
  border-color:var(--red);
  background:
    radial-gradient(160px 90px at 100% 0%, color-mix(in srgb, var(--red) 16%, var(--card)), transparent 70%),
    var(--card);
}
.stat-card.pos .value{color:var(--green);}
.stat-card.neg .value{color:var(--red);}

/* ===== 3D buttons ===== */
.btn{
  border:none;
  border-radius:12px;
  padding:11px 16px;
  font-size:14px;
  font-weight:700;
  cursor:pointer;
  background:var(--primary-dim);
  color:var(--primary);
  box-shadow:0 3px 0 color-mix(in srgb, var(--primary-dim) 55%, #000 10%), 0 4px 8px rgba(0,0,0,.06);
  transform:translateY(0);
  transition:transform .08s ease, box-shadow .08s ease;
}
.btn.primary{
  background:linear-gradient(180deg, #4f8fe0, var(--primary) 55%, var(--primary-dark));
  color:#fff;
  text-shadow:0 1px 1px rgba(0,0,0,.25);
  box-shadow:0 4px 0 var(--primary-dark), 0 6px 12px rgba(3,30,70,.35);
}
.btn.secondary{
  background:linear-gradient(180deg, #8d99ab, var(--secondary) 55%, var(--secondary-dark));
  color:#fff;
  text-shadow:0 1px 1px rgba(0,0,0,.2);
  box-shadow:0 4px 0 var(--secondary-dark), 0 6px 12px rgba(43,50,64,.3);
}
.btn.danger{
  background:var(--red-dim);
  color:var(--red);
  box-shadow:0 3px 0 color-mix(in srgb, var(--red) 35%, var(--red-dim) 65%), 0 4px 8px rgba(0,0,0,.06);
}
.btn.ghost{background:transparent;color:var(--text-dim);box-shadow:none;}
.btn.block{width:100%;display:block;text-align:center;}
.btn:active{transform:translateY(3px);box-shadow:0 0px 0 rgba(0,0,0,0), 0 2px 4px rgba(0,0,0,.08) !important;}
.btn:disabled{opacity:.4;cursor:default;transform:none;}

/* ===== FAB: club-badge orb ===== */
.fab{
  position:fixed;
  right:calc(50% - 280px + 18px);
  bottom:88px;
  width:58px;height:58px;
  border-radius:50%;
  background:
    radial-gradient(circle at 32% 28%, #eef4ff 0%, var(--gold) 22%, var(--primary) 62%, var(--primary-dark) 100%);
  color:#fff;
  font-size:26px;
  font-weight:800;
  border:none;
  display:flex;align-items:center;justify-content:center;
  box-shadow:
    inset 0 2px 3px rgba(255,255,255,.55),
    inset 0 -6px 8px rgba(0,0,0,.2),
    0 5px 0 var(--primary-dark),
    0 8px 16px rgba(3,30,70,.4);
  cursor:pointer;
  z-index:30;
  transition:transform .1s ease, box-shadow .1s ease;
  animation:fabPulse 2.6s ease-in-out infinite;
}
.fab:active{
  transform:translateY(4px) scale(.96);
  box-shadow:
    inset 0 2px 3px rgba(255,255,255,.5),
    inset 0 -4px 6px rgba(0,0,0,.2),
    0 1px 0 var(--primary-dark),
    0 2px 6px rgba(3,30,70,.35);
  animation:none;
}
@keyframes fabPulse{
  0%,100%{box-shadow:inset 0 2px 3px rgba(255,255,255,.55), inset 0 -6px 8px rgba(0,0,0,.2), 0 5px 0 var(--primary-dark), 0 8px 16px rgba(3,30,70,.4);}
  50%{box-shadow:inset 0 2px 3px rgba(255,255,255,.55), inset 0 -6px 8px rgba(0,0,0,.2), 0 5px 0 var(--primary-dark), 0 8px 22px rgba(200,169,74,.6);}
}
@media (max-width:595px){
  .fab{right:18px;}
}

.list-item{
  display:flex;
  align-items:center;
  gap:12px;
  padding:12px 0;
  border-bottom:1px solid var(--border);
}
.list-item:last-child{border-bottom:none;}
.avatar{
  width:38px;height:38px;
  border-radius:50%;
  background:linear-gradient(160deg, var(--primary-dim), color-mix(in srgb, var(--primary-dim) 70%, var(--primary) 30%));
  color:var(--primary);
  font-weight:800;
  display:flex;align-items:center;justify-content:center;
  flex-shrink:0;
  font-size:15px;
  box-shadow:inset 0 -2px 3px rgba(0,0,0,.08), inset 0 1px 1px rgba(255,255,255,.6);
}
.li-main{flex:1;min-width:0;}
.li-title{font-weight:600;font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.li-sub{font-size:12.5px;color:var(--text-dim);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.li-amt{font-weight:800;font-size:14.5px;white-space:nowrap;}
.li-amt.thu{color:var(--green);}
.li-amt.chi{color:var(--red);}
.tag{
  display:inline-block;
  font-size:10.5px;
  font-weight:700;
  padding:2px 7px;
  border-radius:6px;
  margin-right:4px;
}
.tag.quy{background:var(--primary-dim);color:var(--primary);}
.tag.tui{background:var(--amber-dim);color:var(--amber);}
.tag.an{background:var(--green-dim);color:var(--green);}
.tag.khac{background:var(--border);color:var(--text-dim);}

.empty-state{
  text-align:center;
  color:var(--text-dim);
  padding:40px 16px;
  font-size:14px;
}

.segmented{
  display:flex;
  background:var(--bg);
  border-radius:12px;
  padding:4px;
  gap:3px;
  margin-bottom:12px;
  border:1px solid var(--border);
}
.segmented button{
  flex:1;
  border:none;
  background:transparent;
  padding:9px 4px;
  border-radius:9px;
  font-size:13px;
  font-weight:700;
  color:var(--text-dim);
  cursor:pointer;
  transition:transform .08s;
}
.segmented button.active{
  background:linear-gradient(180deg, #4f8fe0, var(--primary));
  color:#fff;
  box-shadow:0 2px 0 var(--primary-dark), 0 3px 6px rgba(3,30,70,.3);
}
.segmented button:active{transform:scale(.95);}

/* form */
.form-group{margin-bottom:14px;}
.form-label{display:block;font-size:12.5px;font-weight:700;color:var(--text-dim);margin-bottom:6px;}
.form-input, .form-select, textarea.form-input{
  width:100%;
  padding:11px 12px;
  border-radius:12px;
  border:1.5px solid var(--border);
  background:var(--card);
  color:var(--text);
  font-size:15px;
  font-family:inherit;
}
.form-input:focus,.form-select:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-dim);}
.settings-divider{height:1px;background:var(--border);margin:18px 0 14px;}
.settings-section-title{font-size:14px;font-weight:800;color:var(--text);margin-bottom:10px;}
.chip-group{display:flex;flex-wrap:wrap;gap:8px;}
.chip{
  padding:8px 14px;
  border-radius:20px;
  border:1.5px solid var(--border);
  background:var(--card);
  font-size:13px;
  font-weight:700;
  cursor:pointer;
  color:var(--text-dim);
  transition:transform .08s;
}
.chip:active{transform:scale(.94);}
.chip.active{background:linear-gradient(180deg,#4f8fe0,var(--primary));border-color:var(--primary-dark);color:#fff;box-shadow:0 2px 0 var(--primary-dark);}
.chip.active.chi{background:linear-gradient(180deg,#ff8a6e,var(--red));border-color:color-mix(in srgb, var(--red) 70%, black 20%);box-shadow:0 2px 0 color-mix(in srgb, var(--red) 70%, black 20%);}
.chip.active.thu{background:linear-gradient(180deg,#4fdb8a,var(--green));border-color:color-mix(in srgb, var(--green) 70%, black 20%);box-shadow:0 2px 0 color-mix(in srgb, var(--green) 70%, black 20%);}

/* modal (bottom sheet) */
.modal-overlay{
  position:fixed;inset:0;
  background:rgba(2,10,25,.55);
  display:flex;align-items:flex-end;justify-content:center;
  z-index:100;
}
.modal-sheet{
  width:100%;max-width:560px;
  max-height:88vh;
  overflow-y:auto;
  background:var(--card);
  border-radius:20px 20px 0 0;
  padding:18px 16px calc(24px + env(safe-area-inset-bottom));
  animation:slideUp .18s ease-out;
  border-top:3px solid var(--gold);
}
@keyframes slideUp{from{transform:translateY(24px);opacity:0;}to{transform:translateY(0);opacity:1;}}
.modal-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;}
.modal-header h3{margin:0;font-size:18px;font-weight:800;}
.modal-close{border:none;background:var(--bg);width:34px;height:34px;border-radius:50%;font-size:16px;cursor:pointer;color:var(--text-dim);}
.modal-actions{display:flex;gap:10px;margin-top:18px;}
.modal-actions .btn{flex:1;}

.toast{
  position:fixed;
  bottom:96px;left:50%;
  transform:translateX(-50%);
  background:var(--primary-dark);
  color:#fff;
  padding:11px 18px;
  border-radius:12px;
  font-size:13.5px;
  font-weight:600;
  z-index:200;
  box-shadow:0 4px 14px rgba(0,0,0,.3);
  max-width:90%;
  text-align:center;
}

/* ===== Meal day nav + quick date jump ===== */
.day-nav{display:flex;align-items:center;gap:8px;margin-bottom:14px;}
.day-nav button{
  border:none;background:var(--card);box-shadow:0 2px 0 var(--border), var(--shadow);
  width:38px;height:38px;border-radius:11px;font-size:17px;cursor:pointer;flex:0 0 auto;
  color:var(--primary);font-weight:800;
  transition:transform .08s;
}
.day-nav button:active{transform:translateY(2px);box-shadow:var(--shadow);}
.day-nav .day-label-wrap{flex:1;position:relative;}
.day-label{
  font-weight:800;font-size:14.5px;text-align:center;
  background:var(--card);border:1.5px solid var(--border);border-radius:11px;
  padding:9px 6px;cursor:pointer;box-shadow:var(--shadow);
}
.day-label .today-badge{
  display:inline-block;background:var(--gold);color:#2a2000;
  font-size:10px;font-weight:800;border-radius:6px;padding:1px 6px;margin-right:6px;vertical-align:middle;
}
.day-date-native{
  position:absolute;inset:0;opacity:0;width:100%;height:100%;border:none;cursor:pointer;
}
.quick-chips{display:flex;gap:7px;margin-bottom:14px;overflow-x:auto;padding-bottom:2px;}
.quick-chips .chip{flex:0 0 auto;padding:7px 12px;font-size:12.5px;}

.meal-table{width:100%;border-collapse:collapse;}
.meal-table th{font-size:11.5px;color:var(--text-dim);font-weight:700;padding-bottom:8px;}
.meal-table td{padding:9px 0;border-top:1px solid var(--border);}
.meal-name{font-size:14px;font-weight:700;}
.meal-check{
  width:32px;height:32px;
  border-radius:10px;
  border:1.5px solid var(--border);
  background:var(--card);
  display:flex;align-items:center;justify-content:center;
  margin:0 auto;
  cursor:pointer;
  font-size:15px;
  font-weight:800;
  color:transparent;
  transition:transform .1s;
  box-shadow:0 2px 0 var(--border);
}
.meal-check:active{transform:translateY(2px);box-shadow:none;}
.meal-check.on{
  background:linear-gradient(180deg,#4fdb8a,var(--green));
  border-color:color-mix(in srgb, var(--green) 70%, black 15%);
  box-shadow:0 2px 0 color-mix(in srgb, var(--green) 70%, black 15%);
  color:#fff;
}

.bar-row{margin-bottom:12px;}
.bar-row .bar-top{display:flex;justify-content:space-between;font-size:13px;margin-bottom:5px;}
.bar-track{height:9px;background:var(--bg);border-radius:6px;overflow:hidden;border:1px solid var(--border);}
.bar-fill{height:100%;background:linear-gradient(90deg,var(--primary),var(--gold));border-radius:6px;}

.member-pick{display:flex;flex-wrap:wrap;gap:8px;margin-top:4px;}
.member-pick .chip{display:flex;align-items:center;gap:6px;}

.link-btn{color:var(--primary);background:none;border:none;font-size:13px;font-weight:700;cursor:pointer;padding:0;}
.text-dim{color:var(--text-dim);}
.text-sm{font-size:12.5px;}
.mt-0{margin-top:0;}
.hint{font-size:12px;color:var(--text-dim);margin-top:4px;}

/* ===== Member monthly summary ===== */
.month-switch{
  display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:14px;
}
.month-switch .month-label{font-weight:800;font-size:15px;flex:1;text-align:center;}
.member-money-row{display:flex;gap:14px;margin-top:6px;}
.member-money-row .mm-item{flex:1;}
.member-money-row .mm-label{font-size:10.5px;color:var(--text-dim);font-weight:700;}
.member-money-row .mm-value{font-size:13.5px;font-weight:800;}
.mm-value.pos{color:var(--green);}
.mm-value.neg{color:var(--red);}

/* ===== Charts: donut + trend bar + category detail ===== */
.donut-wrap{display:flex;align-items:center;gap:18px;}
.donut-svg{flex:0 0 auto;}
.donut-legend{flex:1;min-width:0;}
.legend-row{display:flex;align-items:center;gap:8px;margin-bottom:10px;}
.legend-row:last-child{margin-bottom:0;}
.legend-dot{width:11px;height:11px;border-radius:4px;flex-shrink:0;}
.legend-text{flex:1;min-width:0;}
.legend-label{font-size:12.5px;color:var(--text-dim);font-weight:600;}
.legend-value{font-size:14.5px;font-weight:800;}
.legend-pct{font-size:12px;color:var(--text-dim);font-weight:700;}

.trend-wrap{width:100%;overflow-x:auto;}
.trend-svg{display:block;}

.cat-detail-row{padding:12px 0;border-bottom:1px solid var(--border);}
.cat-detail-row:last-child{border-bottom:none;padding-bottom:0;}
.cat-detail-top{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:4px;}
.cat-detail-name{font-weight:700;font-size:14px;display:flex;align-items:center;gap:7px;}
.cat-detail-total{font-weight:800;font-size:14.5px;}
.cat-detail-meta{font-size:12px;color:var(--text-dim);margin-bottom:6px;}
.cat-detail-meta b{color:var(--text);font-weight:700;}

/* bảng tổng hợp mọi thành viên */
.member-summary-card{padding:14px 0 14px 14px;}
.table-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch;padding-right:14px;}
.member-summary-table{width:100%;border-collapse:collapse;min-width:480px;font-size:13px;}
.member-summary-table thead th{
  text-align:right;
  font-size:11.5px;
  font-weight:800;
  color:var(--text-dim);
  text-transform:none;
  padding:0 8px 8px;
  border-bottom:2px solid var(--border);
  white-space:nowrap;
}
.member-summary-table thead th:first-child{text-align:left;}
.member-summary-table td{
  padding:9px 8px;
  text-align:right;
  border-bottom:1px solid var(--border);
  white-space:nowrap;
  font-variant-numeric:tabular-nums;
}
.member-summary-table tr:last-child td{border-bottom:none;}
.member-summary-table td.msum-name{text-align:left;font-weight:700;color:var(--text);}
.member-summary-table td.msum-remaining{font-weight:800;}
.member-summary-table td.msum-remaining.pos{color:var(--green);}
.member-summary-table td.msum-remaining.neg{color:var(--red);}

/* Toggle switch */
.toggle-wrap{position:relative;display:inline-block;width:44px;height:24px;flex-shrink:0}
.toggle-wrap input{opacity:0;width:0;height:0;position:absolute}
.toggle-slider{position:absolute;inset:0;background:#ccd3e0;border-radius:24px;cursor:pointer;transition:.2s}
.toggle-slider:before{content:"";position:absolute;width:18px;height:18px;left:3px;top:3px;background:#fff;border-radius:50%;transition:.2s}
.toggle-wrap input:checked + .toggle-slider{background:var(--primary)}
.toggle-wrap input:checked + .toggle-slider:before{transform:translateX(20px)}
</style>

<body>
<div id="app">
  <header class="topbar">
    <div class="topbar-title">
      <span class="logo">💰</span>
      <span>Sổ Ăn Thắng</span>
    </div>
    <button id="btnSettings" class="icon-btn" title="Cài đặt / Sao lưu">⚙️</button>
  </header>

  <main id="view" class="view"></main>

  <nav class="tabbar">
    <button class="tab-btn" data-tab="dashboard"><span class="tab-ic">📊</span><span>Tổng quan</span></button>
    <button class="tab-btn" data-tab="transactions"><span class="tab-ic">💵</span><span>Giao dịch</span></button>
    <button class="tab-btn" data-tab="meals"><span class="tab-ic">🍚</span><span>Bữa ăn</span></button>
    <button class="tab-btn" data-tab="members"><span class="tab-ic">👥</span><span>Thành viên</span></button>
    <button class="tab-btn" data-tab="reports"><span class="tab-ic">📈</span><span>Báo cáo</span></button>
  </nav>
</div>

<div id="modalRoot"></div>
<div id="toastRoot"></div>

<input type="file" id="fileImport" accept="application/json" style="display:none">

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script>/* ======================================================================
   SmartFund – quản lý quỹ chung & bữa ăn
   Toàn bộ dữ liệu lưu trong localStorage, có thể Xuất/Nhập JSON
   tương thích với file backup của bản gốc (members / transactions / meals).
   ====================================================================== */

(function () {
  "use strict";

  /* ---------------------------------------------------------------- *
   *  CONSTANTS
   * ---------------------------------------------------------------- */
  const STORAGE_KEY = "smartfund_data_v1";
  const SYNC_PREFIX = "[Đồng bộ] Đóng quỹ từ chi túi: ";

  const CATEGORY_LABEL = { AnUong: "Ăn uống", Khac: "Khác", Thu: "Thu quỹ" };
  const WEEKDAYS = ["CN", "T2", "T3", "T4", "T5", "T6", "T7"];
  const MONTH_NAMES_PAD = (n) => String(n).padStart(2, "0");

  /* ---------------------------------------------------------------- *
   *  UTILITIES
   * ---------------------------------------------------------------- */
  function uid(prefix) {
    return (
      prefix +
      "_" +
      Date.now().toString(36) +
      Math.random().toString(36).slice(2, 7)
    );
  }

  function num(v) {
    if (v === null || v === undefined || v === "") return 0;
    if (typeof v === "number") return v;
    const n = parseFloat(String(v).replace(/[^\d.-]/g, ""));
    return isNaN(n) ? 0 : n;
  }

  function fmtVND(n) {
    n = Math.round(num(n));
    return n.toLocaleString("vi-VN") + "đ";
  }

  function fmtVNDSigned(n) {
    n = Math.round(num(n));
    const s = Math.abs(n).toLocaleString("vi-VN") + "đ";
    return n < 0 ? "-" + s : s;
  }

  // Số tiền rút gọn cho nhãn trên biểu đồ (vd. 1.550.000 -> "1,55tr")
  function fmtVNDShort(n) {
    n = Math.round(num(n));
    const abs = Math.abs(n);
    let out;
    if (abs >= 1000000) {
      out = (n / 1000000).toLocaleString("vi-VN", { maximumFractionDigits: 2 }) + "tr";
    } else if (abs >= 1000) {
      out = Math.round(n / 1000).toLocaleString("vi-VN") + "k";
    } else {
      out = n.toLocaleString("vi-VN");
    }
    return out;
  }

  // Vẽ biểu đồ donut (SVG thuần, không phụ thuộc thư viện ngoài).
  // segments: [{label, value, color}]
  function donutSVG(segments, size) {
    size = size || 118;
    const sw = 20;
    const r = (size - sw) / 2;
    const cx = size / 2,
      cy = size / 2;
    const circ = 2 * Math.PI * r;
    const total = segments.reduce((s, x) => s + Math.max(0, x.value), 0);
    let offset = 0;
    let circles = "";
    if (total > 0) {
      segments.forEach((seg) => {
        if (seg.value <= 0) return;
        const dash = (seg.value / total) * circ;
        circles += `<circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="${seg.color}" stroke-width="${sw}" stroke-dasharray="${dash.toFixed(
          2
        )} ${(circ - dash).toFixed(2)}" stroke-dashoffset="${(-offset).toFixed(
          2
        )}"/>`;
        offset += dash;
      });
    }
    return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" class="donut-svg">
      <g transform="rotate(-90 ${cx} ${cy})">
        <circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="var(--border)" stroke-width="${sw}"/>
        ${circles}
      </g>
      <text x="${cx}" y="${cy - 3}" text-anchor="middle" style="fill:var(--text);font-weight:800;font-size:14px;font-family:inherit">${esc(
      fmtVNDShort(total)
    )}</text>
      <text x="${cx}" y="${cy + 14}" text-anchor="middle" style="fill:var(--text-dim);font-size:9px;font-family:inherit">Tổng chi</text>
    </svg>`;
  }

  // Vẽ biểu đồ cột xu hướng chi tiêu theo tháng (SVG thuần).
  // data: [{label, total}], cột cuối (tháng đang xem) tô màu vàng nổi bật.
  function trendBarSVG(data) {
    const W = 320,
      H = 150,
      marginX = 12,
      topMargin = 24,
      bottomMargin = 22;
    const plotH = H - topMargin - bottomMargin;
    const maxVal = Math.max(1, ...data.map((d) => d.total));
    const slot = (W - marginX * 2) / Math.max(1, data.length);
    const barW = Math.min(36, slot * 0.55);
    let bars = "";
    data.forEach((d, i) => {
      const cx = marginX + slot * i + slot / 2;
      const h = (d.total / maxVal) * plotH;
      const y = topMargin + (plotH - h);
      const isLast = i === data.length - 1;
      const color = isLast ? "var(--gold)" : "var(--primary)";
      bars += `<rect x="${(cx - barW / 2).toFixed(1)}" y="${y.toFixed(
        1
      )}" width="${barW.toFixed(1)}" height="${Math.max(h, 0).toFixed(
        1
      )}" rx="5" fill="${color}"/>`;
      if (d.total > 0) {
        bars += `<text x="${cx.toFixed(
          1
        )}" y="${(y - 6).toFixed(
          1
        )}" text-anchor="middle" style="fill:var(--text);font-size:9px;font-weight:700;font-family:inherit">${esc(
          fmtVNDShort(d.total)
        )}</text>`;
      }
      bars += `<text x="${cx.toFixed(1)}" y="${(H - bottomMargin + 14).toFixed(
        1
      )}" text-anchor="middle" style="fill:var(--text-dim);font-size:9.5px;font-weight:600;font-family:inherit">${esc(
        d.label
      )}</text>`;
    });
    return `<svg viewBox="0 0 ${W} ${H}" width="100%" height="${H}" class="trend-svg" preserveAspectRatio="none">
      <line x1="${marginX}" y1="${(H - bottomMargin).toFixed(1)}" x2="${
      W - marginX
    }" y2="${(H - bottomMargin).toFixed(
      1
    )}" stroke="var(--border)" stroke-width="1"/>
      ${bars}
    </svg>`;
  }

  function toDateStr(d) {
    if (typeof d === "string") return d.slice(0, 10);
    const y = d.getFullYear(),
      m = MONTH_NAMES_PAD(d.getMonth() + 1),
      day = MONTH_NAMES_PAD(d.getDate());
    return `${y}-${m}-${day}`;
  }

  function todayStr() {
    return toDateStr(new Date());
  }

  function fmtDateVN(dateStr) {
    if (!dateStr) return "";
    const [y, m, d] = dateStr.slice(0, 10).split("-");
    return `${d}/${m}/${y}`;
  }

  function fmtDateLong(dateStr) {
    const dt = new Date(dateStr + "T00:00:00");
    const wd = WEEKDAYS[dt.getDay()];
    return `${wd}, ${fmtDateVN(dateStr)}`;
  }

  function fmtMonthLabel(dateStr) {
    const [y, m] = dateStr.slice(0, 10).split("-");
    return `Tháng ${parseInt(m, 10)}/${y}`;
  }

  function esc(s) {
    return String(s ?? "").replace(
      /[&<>"']/g,
      (c) =>
        ({
          "&": "&amp;",
          "<": "&lt;",
          ">": "&gt;",
          '"': "&quot;",
          "'": "&#39;",
        }[c])
    );
  }

  function initials(name) {
    const parts = String(name || "?").trim().split(/\s+/);
    const last = parts[parts.length - 1] || "?";
    return last.slice(0, 1).toUpperCase();
  }

  function debounce(fn, ms) {
    let t;
    return (...args) => {
      clearTimeout(t);
      t = setTimeout(() => fn(...args), ms);
    };
  }

  /* ---------------------------------------------------------------- *
   *  DATA LAYER (localStorage + import/export compatible JSON)
   * ---------------------------------------------------------------- */
  const DB = {
    state: null,

    defaultState() {
      return { members: [], transactions: [], meals: {} };
    },

    load() {
      let raw = null;
      try {
        raw = localStorage.getItem(STORAGE_KEY);
      } catch (e) {}
      if (!raw) {
        this.state = this.defaultState();
        return this.state;
      }
      try {
        const parsed = JSON.parse(raw);
        this.state = this.normalizeImported(parsed);
      } catch (e) {
        this.state = this.defaultState();
      }
      return this.state;
    },

    save() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(this.state));
      } catch (e) {
        console.error("Không lưu được dữ liệu", e);
        toast("⚠️ Không lưu được dữ liệu (bộ nhớ đầy?)");
      }
    },

    // Chuẩn hoá dữ liệu import (từ backup cũ hoặc file nhập) về cấu trúc nội bộ gọn:
    // transaction: {id, type, category, subType, amount, description, memberId, participants[], date, datetime, linkedId?}
    normalizeImported(parsed) {
      const state = this.defaultState();
      const members = Array.isArray(parsed.members) ? parsed.members : [];
      state.members = members
        .filter((m) => m && m.id)
        .map((m) => ({ id: m.id, name: m.name || "Chưa đặt tên" }));

      const txs = Array.isArray(parsed.transactions) ? parsed.transactions : [];
      state.transactions = txs
        .filter((t) => t && t.id)
        .map((t) => {
          const amount = t.amount !== undefined ? num(t.amount) : num(t.amt);
          const datetime = t.datetime || t.date || new Date().toISOString();
          const subTypeRaw = (t.subType || "").toString();
          const subType = subTypeRaw === "quy" ? "quy" : "tui"; // mặc định "túi" nếu thiếu
          return {
            id: t.id,
            type: t.type === "Thu" ? "Thu" : "Chi",
            category: t.category || "Khac",
            subType,
            amount,
            description: t.description || t.desc || "",
            memberId: t.memberId || t.mid || null,
            participants: Array.isArray(t.participants) ? t.participants : [],
            date: toDateStr(datetime),
            datetime,
            linkedId: t.linkedId || undefined,
          };
        });

      state.meals =
        parsed.meals && typeof parsed.meals === "object" ? parsed.meals : {};
      return state;
    },

    // Xuất ra đúng dạng tương thích với backup gốc
    exportObject() {
      const members = this.state.members.map((m) => ({ id: m.id, name: m.name }));
      const transactions = [];
      this.state.transactions.forEach((t) => {
        const base = {
          id: t.id,
          datetime: t.datetime,
          date: t.datetime,
          memberId: t.memberId,
          mid: t.memberId,
          description: t.description,
          desc: t.description,
          type: t.type,
          category: t.category,
          amount: t.amount,
          amt: String(t.amount),
          participants: t.participants || [],
          subType: t.subType,
        };
        if (t.linkedId) base.linkedId = t.linkedId;
        transactions.push(base);
      });
      return { members, transactions, meals: this.state.meals };
    },

    download() {
      const data = this.exportObject();
      const blob = new Blob([JSON.stringify(data, null, 0)], {
        type: "application/json",
      });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      const stamp = todayStr().replace(/-/g, "");
      a.href = url;
      a.download = `SmartFund_Backup_${stamp}.json`;
      document.body.appendChild(a);
      a.click();
      a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 2000);
    },

    reset() {
      this.state = this.defaultState();
      this.save();
    },

    // ---- Members ----
    addMember(name) {
      const m = { id: uid("m"), name: name.trim(), updatedAt: Date.now() };
      this.state.members.push(m);
      this.save();
      return m;
    },
    updateMember(id, name) {
      const m = this.state.members.find((x) => x.id === id);
      if (m) {
        m.name = name.trim();
        m.updatedAt = Date.now();
        this.save();
      }
    },
    deleteMember(id) {
      this.state.members = this.state.members.filter((x) => x.id !== id);
      this.save();
    },
    getMember(id) {
      return this.state.members.find((x) => x.id === id);
    },
    memberName(id) {
      const m = this.getMember(id);
      return m ? m.name : "—";
    },

    // ---- Transactions (+ auto-sync túi -> quỹ) ----
    // payload: {type, category, subType, amount, description, memberId, participants, date}
    addTransaction(payload) {
      const id = uid("tx");
      const datetime = (payload.date || todayStr()) + "T" + nowTime();
      const tx = {
        id,
        type: payload.type,
        category: payload.category,
        subType: payload.subType,
        amount: num(payload.amount),
        description: payload.description.trim(),
        memberId: payload.memberId,
        participants: payload.participants || [],
        date: payload.date || todayStr(),
        datetime,
        updatedAt: Date.now(),
      };
      this.state.transactions.push(tx);
      if (tx.type === "Chi" && tx.subType === "tui") {
        this.createOrUpdateAutoSync(tx);
      }
      this.save();
      return tx;
    },

    updateTransaction(id, payload) {
      const tx = this.state.transactions.find((t) => t.id === id);
      if (!tx) return;
      Object.assign(tx, {
        type: payload.type,
        category: payload.category,
        subType: payload.subType,
        amount: num(payload.amount),
        description: payload.description.trim(),
        memberId: payload.memberId,
        participants: payload.participants || [],
        date: payload.date || tx.date,
      });
      tx.datetime = tx.date + "T" + (tx.datetime.split("T")[1] || nowTime());
      tx.updatedAt = Date.now();

      if (tx.type === "Chi" && tx.subType === "tui") {
        this.createOrUpdateAutoSync(tx);
      } else {
        this.removeAutoSync(tx.id);
      }
      this.save();
    },

    deleteTransaction(id) {
      this.removeAutoSync(id);
      this.state.transactions = this.state.transactions.filter(
        (t) => t.id !== id && t.linkedId !== id
      );
      this.save();
    },

    createOrUpdateAutoSync(tx) {
      let auto = this.state.transactions.find((t) => t.linkedId === tx.id);
      const desc = SYNC_PREFIX + tx.description;
      if (auto) {
        auto.amount = tx.amount;
        auto.description = desc;
        auto.date = tx.date;
        auto.datetime = tx.datetime;
        auto.memberId = tx.memberId;
        auto.updatedAt = Date.now();
      } else {
        auto = {
          id: uid("auto_tx"),
          type: "Thu",
          category: "Thu",
          subType: "quy",
          amount: tx.amount,
          description: desc,
          memberId: tx.memberId,
          participants: [],
          date: tx.date,
          datetime: tx.datetime,
          linkedId: tx.id,
          updatedAt: Date.now(),
        };
        this.state.transactions.push(auto);
      }
    },

    removeAutoSync(txId) {
      this.state.transactions = this.state.transactions.filter(
        (t) => t.linkedId !== txId
      );
    },

    // Giao dịch "chính" hiển thị trong danh sách (ẩn bản ghi đồng bộ tự động)
    visibleTransactions() {
      return this.state.transactions
        .filter((t) => !t.linkedId)
        .sort((a, b) => (a.datetime < b.datetime ? 1 : -1));
    },

    // ---- Quỹ balance & tổng hợp ----
    // Số dư quỹ = tiền đã đóng quỹ thủ công (Thu, không tính bản ghi đồng bộ) trừ ĐI
    // tiền đã chi TRỰC TIẾP từ quỹ (subType "quy").
    // Chi tiêu cá nhân (chi từ túi, subType "tui") KHÔNG được trừ ở đây, vì mỗi khoản
    // chi túi luôn đi kèm đúng một khoản Thu đồng bộ cùng số tiền (xem createOrUpdateAutoSync) —
    // hai khoản này luôn triệt tiêu nhau vì tiền chi túi chưa bao giờ thực sự nằm trong quỹ.
    // Trừ cả chi túi lẫn không cộng lại khoản đồng bộ sẽ làm số dư bị trừ hai lần (sai).
    fundBalance() {
      let thuManual = 0,
        chiQuy = 0;
      this.state.transactions.forEach((t) => {
        if (t.type === "Thu" && !t.linkedId) thuManual += t.amount;
        else if (t.type === "Chi" && t.subType === "quy") chiQuy += t.amount;
      });
      return thuManual - chiQuy;
    },

    totals() {
      let thuDues = 0,
        thuSync = 0,
        chiQuy = 0,
        chiTuiAn = 0,
        chiTuiKhac = 0;
      this.state.transactions.forEach((t) => {
        if (t.type === "Thu") {
          if (t.linkedId) thuSync += t.amount;
          else thuDues += t.amount;
        } else if (t.type === "Chi") {
          if (t.subType === "quy") chiQuy += t.amount;
          else if (t.category === "AnUong") chiTuiAn += t.amount;
          else chiTuiKhac += t.amount;
        }
      });
      return { thuDues, thuSync, chiQuy, chiTuiAn, chiTuiKhac };
    },

    // ---- Meals ----
    mealKey(dateStr, memberId) {
      return `${dateStr}_${memberId}`;
    },
    getMeal(dateStr, memberId) {
      return (
        this.state.meals[this.mealKey(dateStr, memberId)] || {
          breakfast: false,
          lunch: false,
          dinner: false,
        }
      );
    },
    toggleMeal(dateStr, memberId, slot) {
      const key = this.mealKey(dateStr, memberId);
      const cur = this.state.meals[key] || {
        breakfast: false,
        lunch: false,
        dinner: false,
      };
      cur[slot] = !cur[slot];
      cur.updatedAt = Date.now();
      this.state.meals[key] = cur;
      this.save();
      return cur[slot];
    },
    // "Sổ cái" của từng thành viên trong một khoảng ngày (toàn thời gian hoặc 1 tháng):
    //   - Đã góp   = tiền họ đã đóng quỹ thủ công (Thu, không tính bản ghi đồng bộ)
    //                CỘNG tiền họ đã tự ứng ra chi túi (vì đó cũng là tiền họ bỏ ra
    //                cho cả nhóm, chỉ là trả thẳng thay vì nộp vào quỹ trước).
    //   - Tiền ăn  = phần ăn uống (danh mục AnUong) họ đã "ăn", tính THEO TỪNG NGÀY:
    //                giá/bữa của ngày đó = tổng chi AnUong ngày đó / tổng số bữa cả
    //                nhóm ăn ngày đó; rồi nhân với số bữa CHÍNH người đó ăn ngày đó.
    //                (Không dùng giá bình quân cả kỳ, vì ngày đắt/rẻ khác nhau nên
    //                phải tính đúng ngày để công bằng.)
    //   - Chi khác = phần chi phí "Khác" (ga, đồ dùng chung...), MỖI GIAO DỊCH chia
    //                đều cho đúng những người có tên trong participants của giao
    //                dịch đó. Nếu giao dịch không ghi participants, mặc định chia
    //                đều cho tất cả thành viên (không có cách nào xác định ai dùng).
    //   - Đã dùng  = Tiền ăn + Chi khác
    //   - Còn lại  = Đã góp - Đã dùng  (dương = còn dư, âm = đang nợ quỹ)
    // Luôn tính lại trực tiếp từ transactions/meals -> cập nhật tức thời mỗi khi render.
    memberLedger(startStr, endStr) {
      const members = this.state.members;
      const allIds = members.map((m) => m.id);

      // ----- Tiền ăn: phân bổ theo giá/bữa của TỪNG NGÀY -----
      const dayAnUong = {}; // date -> tổng chi AnUong ngày đó
      this.state.transactions.forEach((t) => {
        if (t.type !== "Chi" || t.category !== "AnUong") return;
        if (t.date < startStr || t.date > endStr) return;
        dayAnUong[t.date] = (dayAnUong[t.date] || 0) + t.amount;
      });

      const dayMemberMeals = {}; // date -> memberId -> số bữa
      const dayTotalMeals = {}; // date -> tổng số bữa cả nhóm
      Object.keys(this.state.meals).forEach((key) => {
        const idx = key.lastIndexOf("_");
        const date = key.slice(0, idx).slice(0, 10);
        const memberId = key.slice(idx + 1);
        if (date < startStr || date > endStr) return;
        if (allIds.indexOf(memberId) === -1) return;
        const m = this.state.meals[key];
        let c = 0;
        ["breakfast", "lunch", "dinner"].forEach((slot) => {
          if (m[slot]) c++;
        });
        if (c === 0) return;
        dayMemberMeals[date] = dayMemberMeals[date] || {};
        dayMemberMeals[date][memberId] =
          (dayMemberMeals[date][memberId] || 0) + c;
        dayTotalMeals[date] = (dayTotalMeals[date] || 0) + c;
      });

      const tienAn = {};
      const mealCount = {};
      members.forEach((m) => {
        tienAn[m.id] = 0;
        mealCount[m.id] = 0;
      });
      let anUongSpend = 0,
        totalSlots = 0;
      Object.keys(dayAnUong).forEach((date) => {
        const spend = dayAnUong[date];
        anUongSpend += spend;
        const slotsThatDay = dayTotalMeals[date] || 0;
        if (slotsThatDay === 0) return; // không ai check-in ngày đó, không phân bổ được
        const rate = spend / slotsThatDay;
        const mm = dayMemberMeals[date] || {};
        Object.keys(mm).forEach((mid) => {
          if (!(mid in tienAn)) return;
          tienAn[mid] += mm[mid] * rate;
        });
      });
      Object.keys(dayTotalMeals).forEach((date) => {
        totalSlots += dayTotalMeals[date];
        const mm = dayMemberMeals[date] || {};
        Object.keys(mm).forEach((mid) => {
          if (mid in mealCount) mealCount[mid] += mm[mid];
        });
      });

      // ----- Chi phí Khác: chia theo participants của TỪNG giao dịch -----
      const chiKhac = {};
      members.forEach((m) => (chiKhac[m.id] = 0));
      let khacSpend = 0;
      this.state.transactions.forEach((t) => {
        if (t.type !== "Chi" || t.category === "AnUong") return;
        if (t.date < startStr || t.date > endStr) return;
        khacSpend += t.amount;
        const parts =
          t.participants && t.participants.length ? t.participants : allIds;
        const validParts = parts.filter((id) => id in chiKhac);
        const share = validParts.length
          ? t.amount / validParts.length
          : 0;
        validParts.forEach((id) => {
          chiKhac[id] += share;
        });
      });

      // ----- Đã góp: Thu thủ công + tự ứng chi túi -----
      const contributed = {};
      members.forEach((m) => (contributed[m.id] = 0));
      this.state.transactions.forEach((t) => {
        if (t.date < startStr || t.date > endStr) return;
        if (t.type === "Thu" && !t.linkedId) {
          contributed[t.memberId] = (contributed[t.memberId] || 0) + t.amount;
        } else if (t.type === "Chi" && t.subType === "tui") {
          contributed[t.memberId] = (contributed[t.memberId] || 0) + t.amount;
        }
      });

      const perMember = {};
      members.forEach((m) => {
        const used = (tienAn[m.id] || 0) + (chiKhac[m.id] || 0);
        const paid = contributed[m.id] || 0;
        perMember[m.id] = {
          contributed: paid,
          used,
          tienAn: tienAn[m.id] || 0,
          chiKhac: chiKhac[m.id] || 0,
          remaining: paid - used,
          meals: mealCount[m.id] || 0,
        };
      });

      const costPerMeal = totalSlots > 0 ? anUongSpend / totalSlots : 0;
      return { perMember, costPerMeal, totalSlots, anUongSpend, khacSpend };
    },

    mealCountInRange(startStr, endStr) {
      // trả về {memberId: {breakfast,lunch,dinner,total}}
      const out = {};
      this.state.members.forEach((m) => {
        out[m.id] = { breakfast: 0, lunch: 0, dinner: 0, total: 0 };
      });
      Object.keys(this.state.meals).forEach((key) => {
        const idx = key.lastIndexOf("_");
        const date = key.slice(0, idx).slice(0, 10);
        const memberId = key.slice(idx + 1);
        if (date < startStr || date > endStr) return;
        if (!out[memberId]) return;
        const m = this.state.meals[key];
        ["breakfast", "lunch", "dinner"].forEach((slot) => {
          if (m[slot]) {
            out[memberId][slot]++;
            out[memberId].total++;
          }
        });
      });
      return out;
    },

    // Thống kê chi tiết từng danh mục (AnUong, Khac) trong 1 khoảng ngày:
    // tổng tiền, số giao dịch, trung bình/giao dịch. Dùng cho biểu đồ + bảng chi tiết.
    categoryDetail(startStr, endStr) {
      const out = {
        AnUong: { total: 0, count: 0 },
        Khac: { total: 0, count: 0 },
      };
      this.state.transactions.forEach((t) => {
        if (t.type !== "Chi") return;
        if (t.date < startStr || t.date > endStr) return;
        const key = t.category === "AnUong" ? "AnUong" : "Khac";
        out[key].total += t.amount;
        out[key].count += 1;
      });
      Object.keys(out).forEach((k) => {
        out[k].avg = out[k].count ? out[k].total / out[k].count : 0;
      });
      out.grandTotal = out.AnUong.total + out.Khac.total;
      return out;
    },

    // Chuỗi tổng chi tiêu (AnUong + Khac, mọi subType) theo từng tháng,
    // `count` tháng gần nhất tính đến và bao gồm tháng endYm (YYYY-MM).
    // Dùng để vẽ biểu đồ cột xu hướng chi tiêu.
    monthlySpendSeries(endYm, count) {
      const [ey, em] = endYm.split("-").map(Number);
      const months = [];
      for (let i = count - 1; i >= 0; i--) {
        const d = new Date(ey, em - 1 - i, 1);
        const ym = `${d.getFullYear()}-${MONTH_NAMES_PAD(d.getMonth() + 1)}`;
        months.push({ ym, y: d.getFullYear(), m: d.getMonth() + 1, total: 0 });
      }
      const idxByYm = {};
      months.forEach((mo, i) => (idxByYm[mo.ym] = i));
      this.state.transactions.forEach((t) => {
        if (t.type !== "Chi") return;
        const ym = t.date.slice(0, 7);
        if (!(ym in idxByYm)) return;
        months[idxByYm[ym]].total += t.amount;
      });
      months.forEach((mo) => {
        mo.label = `T${mo.m}`;
      });
      return months;
    },

  };

  function nowTime() {
    const d = new Date();
    return `${MONTH_NAMES_PAD(d.getHours())}:${MONTH_NAMES_PAD(d.getMinutes())}`;
  }

          </div>
          <div id="modalBody">${bodyHtml}</div>
        </div>
      </div>`;
    document.getElementById("modalCloseBtn").onclick = closeModal;
    document.getElementById("modalOverlay").addEventListener("click", (e) => {
      if (e.target.id === "modalOverlay") closeModal();
    });
    if (onMount) onMount(document.getElementById("modalBody"));

    UI.tab = tab;

    const view = document.getElementById("view");
    removeFab();

        view.innerHTML = renderTransactions();

        wireTransactionsEvents();
        break;
      case "meals":
        view.innerHTML = renderMeals();
        wireMealsEvents();
        break;
      case "members":
        view.innerHTML = renderMembers();
        addFab("➕", () => openMemberModal());
        wireMembersEvents();
        break;
      case "reports":
        view.innerHTML = renderReports();
        wireReportsEvents();
        break;
    }

    document.getElementById("app").appendChild(btn);

    document.querySelectorAll("[data-edit-member]").forEach((btn) => {
      btn.onclick = () =>
        openMemberModal(DB.getMember(btn.dataset.editMember));

    if (prevBtn)
      prevBtn.onclick = () => {
        UI.reportMonth = shiftMonth(UI.reportMonth, -1);
        render();

  function openMemberModal(member) {
    const isEdit = !!member;
    openModal(
      isEdit ? "Sửa thành viên" : "Thêm thành viên",
      `
        <div class="form-group">
          <label class="form-label">Tên thành viên</label>
          <input class="form-input" id="memberNameInput" maxlength="40" placeholder="VD: Thắng" value="${
            isEdit ? esc(member.name) : ""
          }">

        <div class="modal-actions">
          ${isEdit ? `<button class="btn danger" id="memberDeleteBtn">Xoá</button>` : ""}
          <button class="btn primary" id="memberSaveBtn">${
            isEdit ? "Lưu" : "Thêm"
          }</button>
        </div>
      `,
      {
        onMount: () => {
          const input = document.getElementById("memberNameInput");
          input.focus();
          document.getElementById("memberSaveBtn").onclick = () => {
            const name = input.value.trim();
            if (!name) {
              toast("Vui lòng nhập tên");
              return;
            }
            if (isEdit) DB.updateMember(member.id, name);
            else DB.addMember(name);
            closeModal();
            render();
            toast(isEdit ? "Đã lưu" : "Đã thêm thành viên");
          };
          const delBtn = document.getElementById("memberDeleteBtn");
          if (delBtn)
            delBtn.onclick = () => {
              const usedCount = DB.state.transactions.filter(
                (t) => t.memberId === member.id
              ).length;
              const msg = usedCount
                ? `Thành viên này có ${usedCount} giao dịch liên quan. Vẫn xoá?`
                : "Xoá thành viên này?";
              if (confirm(msg)) {
                DB.deleteMember(member.id);
                closeModal();
                render();
                toast("Đã xoá thành viên");
              }
            };
        },
      }
    );
