<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no">
<title>SmartFund - Quỹ chung</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&display=swap" rel="stylesheet">

<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#034694">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="SmartFund">

<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
  <header class="topbar">
    <div class="topbar-title">
      <span class="logo">💰</span>
      <span>SmartFund</span>
    </div>
    <button id="btnSettings" class="icon-btn" title="Cài đặt / Sao lưu">⚙️</button>
  </header>

  <main id="view" class="view"></main>

  <nav class="tabbar">
    <button class="tab-btn" data-tab="dashboard"><span class="tab-ic">📊</span><span>Tổng quan</span></button>
    <button class="tab-btn" data-tab="transactions"><span class="tab-ic">💵</span><span>Giao dịch</span></button>
    <button class="tab-btn" data-tab="meals"><span class="tab-ic">🍚</span><span>Bữa ăn</span></button>
    <button class="tab-btn" data-tab="members"><span class="tab-ic">👥</span><span>Thành viên</span></button>
    <button class="tab-btn" data-tab="reports"><span class="tab-ic">📈</span><span>Báo cáo</span></button>
  </nav>
</div>

<div id="modalRoot"></div>
<div id="toastRoot"></div>

<input type="file" id="fileImport" accept="application/json" style="display:none">

<script src="app.js"></script>
<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', function () {
      navigator.serviceWorker.register('sw.js').catch(function () { /* offline-first: im lặng nếu không đăng ký được */ });
    });
  }
</script>
</body>
</html>
