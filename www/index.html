        <div class="hint" id="subTypeHint"></div>
      </div>
      <div class="form-group">
        <label class="form-label">Danh mục</label>
        <div class="chip-group" id="catChips">
          <div class="chip ${category === "AnUong" ? "active" : ""}" data-v="AnUong">Ăn uống / đi chợ</div>
          <div class="chip ${category === "Khac" ? "active" : ""}" data-v="Khac">Khác</div>
        </div>
      </div>
      <div class="form-group">
        <label class="form-label">Số tiền (đ)</label>
        <input class="form-input" id="amountInput" inputmode="numeric" placeholder="0" value="${
          tx ? tx.amount : ""
        }">
      </div>
      <div class="form-group">
        <label class="form-label">Mô tả</label>
        <input class="form-input" id="descInput" maxlength="120" placeholder="VD: Đi chợ, Đóng quỹ tháng..." value="${
          tx ? esc(tx.description) : ""
        }">
      </div>
      <div class="form-group">
        <label class="form-label">Người thực hiện</label>
        <select class="form-select" id="memberSelect">
          ${members
            .map(
              (m) =>
                `<option value="${m.id}" ${
                  m.id === memberId ? "selected" : ""
                }>${esc(m.name)}</option>`
            )
            .join("")}
        </select>
      </div>
      <div class="form-group">
        <label class="form-label">Ngày</label>
        <input class="form-input" type="date" id="dateInput" value="${
          tx ? tx.date : todayStr()
        }">
      </div>
      <div class="form-group">
        <label class="form-label" style="display:flex;align-items:center;justify-content:space-between">
          <span>Chia chi phí chung</span>
          <label class="toggle-wrap">
            <input type="checkbox" id="toggleSplit" ${hasParticipants ? "checked" : ""}>
            <span class="toggle-slider"></span>
          </label>
        </label>
        <div id="participantWrap" style="display:${hasParticipants ? "block" : "none"};margin-top:8px">
          <div class="hint" style="margin-bottom:6px">Chọn người tham gia chi phí này:</div>
          <div class="member-pick" id="participantPick">
            ${members
              .map(
                (m) => `
              <div class="chip ${
                participants.includes(m.id) ? "active" : ""
              }" data-member="${m.id}">${esc(m.name)}</div>`
              )
              .join("")}
          </div>
        </div>
      </div>
      <div class="modal-actions">
        ${isEdit ? `<button class="btn danger" id="txDeleteBtn">Xoá</button>` : ""}
        <button class="btn primary" id="txSaveBtn">${
          isEdit ? "Lưu" : "Thêm"
        }</button>
      </div>
    `;

    openModal(isEdit ? "Sửa giao dịch" : "Thêm giao dịch", body, {
      onMount: (root) => {
        let curType = type,
          curSubType = subType,
          curCategory = category;
        const selParticipants = new Set(participants);

        // Toggle chia chi phí
        const toggleSplit = document.getElementById("toggleSplit");
        const participantWrap = document.getElementById("participantWrap");
        toggleSplit.onchange = () => {
          participantWrap.style.display = toggleSplit.checked ? "block" : "none";
          if (!toggleSplit.checked) selParticipants.clear();
        };

        function updateHint() {
          const hint = document.getElementById("subTypeHint");
          if (curType === "Chi" && curSubType === "tui") {
            hint.textContent =
              "Số tiền này sẽ tự động được ghi nhận là một khoản Thu vào quỹ chung (đồng bộ).";
          } else {
            hint.textContent = "";
          }
        }
        updateHint();

        root.querySelectorAll("#typeChips .chip").forEach((c) => {
          c.onclick = () => {
            curType = c.dataset.v;
            root
              .querySelectorAll("#typeChips .chip")
              .forEach((x) =>
                x.classList.remove("active", "chi", "thu")
              );
            c.classList.add("active", curType === "Chi" ? "chi" : "thu");
            updateHint();
          };
        });
        root.querySelectorAll("#subTypeChips .chip").forEach((c) => {
          c.onclick = () => {
            curSubType = c.dataset.v;
            root
              .querySelectorAll("#subTypeChips .chip")
              .forEach((x) => x.classList.remove("active"));
            c.classList.add("active");
            updateHint();
          };
        });
        root.querySelectorAll("#catChips .chip").forEach((c) => {
          c.onclick = () => {
            curCategory = c.dataset.v;
            root
              .querySelectorAll("#catChips .chip")
              .forEach((x) => x.classList.remove("active"));
            c.classList.add("active");
          };
        });
        root.querySelectorAll("#participantPick .chip").forEach((c) => {
          c.onclick = () => {
            const id = c.dataset.member;
            if (selParticipants.has(id)) {
              selParticipants.delete(id);
              c.classList.remove("active");
            } else {
              selParticipants.add(id);
              c.classList.add("active");
            }
          };
        });

        document.getElementById("txSaveBtn").onclick = () => {
          const amount = num(document.getElementById("amountInput").value);
          const description = document.getElementById("descInput").value.trim();
          const memberIdVal = document.getElementById("memberSelect").value;
          const date = document.getElementById("dateInput").value || todayStr();
          if (!amount || amount <= 0) {
            toast("Vui lòng nhập số tiền hợp lệ");
            return;
          }
          if (!description) {
            toast("Vui lòng nhập mô tả");
            return;
          }
          const payload = {
            type: curType,
            subType: curSubType,
            category: curCategory,
            amount,
            description,
            memberId: memberIdVal,
            participants: Array.from(selParticipants),
            date,
          };
          if (isEdit) DB.updateTransaction(tx.id, payload);
          else DB.addTransaction(payload);
          closeModal();
          render();
          toast(isEdit ? "Đã lưu giao dịch" : "Đã thêm giao dịch");
        };

        const delBtn = document.getElementById("txDeleteBtn");
        if (delBtn)
          delBtn.onclick = () => {
            if (confirm("Xoá giao dịch này?")) {
              DB.deleteTransaction(tx.id);
              closeModal();
              render();
              toast("Đã xoá giao dịch");
            }
          };
      },
    });
  }

  /* ================= MEALS ================= */
  function shiftDate(dateStr, delta) {
    const d = new Date(dateStr + "T00:00:00");
    d.setDate(d.getDate() + delta);
    return toDateStr(d);
  }

  function renderMeals() {
    const members = DB.state.members;
    const date = UI.mealDate;
    if (members.length === 0) {
      return `<div class="card">${emptyState(
        "Hãy thêm thành viên trước khi ghi nhận bữa ăn."
      )}</div>`;
    }
    const rows = members
      .map((m) => {
        const meal = DB.getMeal(date, m.id);
        return `
        <tr data-member="${m.id}">
          <td>
            <div style="display:flex;align-items:center;gap:8px">
              <div class="avatar" style="width:28px;height:28px;font-size:12px">${esc(
                initials(m.name)
              )}</div>
              <span class="meal-name">${esc(m.name)}</span>
            </div>
          </td>
          <td><div class="meal-check ${
            meal.breakfast ? "on" : ""
          }" data-slot="breakfast">✓</div></td>
          <td><div class="meal-check ${
            meal.lunch ? "on" : ""
          }" data-slot="lunch">✓</div></td>
          <td><div class="meal-check ${
            meal.dinner ? "on" : ""
          }" data-slot="dinner">✓</div></td>
        </tr>`;
      })
      .join("");

    const yesterday = shiftDate(todayStr(), -1);
    const tomorrow = shiftDate(todayStr(), 1);
    const isToday = date === todayStr();

    return `
      <div class="day-nav">
        <button id="mealPrev">‹</button>
        <div class="day-label-wrap">
          <div class="day-label">${
            isToday ? `<span class="today-badge">HÔM NAY</span>` : ""
          }${fmtDateLong(date)}</div>
          <input type="date" class="day-date-native" id="mealDateInput" value="${date}">
        </div>
        <button id="mealNext">›</button>
      </div>
      <div class="quick-chips">
        <div class="chip ${
          date === yesterday ? "active" : ""
        }" data-qd="${yesterday}">Hôm qua</div>
        <div class="chip ${
          isToday ? "active" : ""
        }" data-qd="${todayStr()}">Hôm nay</div>
        <div class="chip ${
          date === tomorrow ? "active" : ""
        }" data-qd="${tomorrow}">Ngày mai</div>
      </div>
      <div class="card">
        <table class="meal-table">
          <thead>
            <tr><th style="text-align:left">Thành viên</th><th>🌅 Sáng</th><th>☀️ Trưa</th><th>🌙 Tối</th></tr>
          </thead>
          <tbody>${rows}</tbody>
        </table>
      </div>
    `;
  }

  function wireMealsEvents() {
    const mealPrev = document.getElementById("mealPrev");
    if (mealPrev) mealPrev.onclick = () => {
      UI.mealDate = shiftDate(UI.mealDate, -1);
      render();
    };
    const mealNext = document.getElementById("mealNext");
    if (mealNext) mealNext.onclick = () => {
      UI.mealDate = shiftDate(UI.mealDate, 1);
      render();
    };
    const dateInput = document.getElementById("mealDateInput");
    if (dateInput) {
      // Chạm vào nhãn ngày sẽ mở lịch chọn nhanh (native date picker) để nhảy tới
      // bất kỳ ngày nào chỉ trong 1 thao tác, thay vì phải bấm ‹ › nhiều lần.
      dateInput.onclick = () => {
        if (dateInput.showPicker) {
          try {
            dateInput.showPicker();
          } catch (e) {}
        }
      };
      dateInput.onchange = () => {
        if (dateInput.value) {
          UI.mealDate = dateInput.value;
          render();
        }
      };
    }
    document.querySelectorAll("[data-qd]").forEach((chip) => {
      chip.onclick = () => {
        UI.mealDate = chip.dataset.qd;
        render();
      };
    });
    document.querySelectorAll(".meal-check").forEach((el) => {
      el.onclick = () => {
        const row = el.closest("tr");
        const memberId = row.dataset.member;
        const slot = el.dataset.slot;
        const on = DB.toggleMeal(UI.mealDate, memberId, slot);
        el.classList.toggle("on", on);
      };
    });
  }

  /* ================= REPORTS ================= */
  function monthRange(ym) {
    const [y, m] = ym.split("-").map(Number);
    const start = `${y}-${MONTH_NAMES_PAD(m)}-01`;
    const lastDay = new Date(y, m, 0).getDate();
    const end = `${y}-${MONTH_NAMES_PAD(m)}-${MONTH_NAMES_PAD(lastDay)}`;
    return { start, end };
  }

  function renderReports() {
    const { start, end } = monthRange(UI.reportMonth);
    const txInMonth = DB.state.transactions.filter(
      (t) => t.date >= start && t.date <= end
    );

    // Chi tiêu theo thành viên (chi túi, loại trừ bản ghi đồng bộ)
    const byMember = {};
    DB.state.members.forEach((m) => (byMember[m.id] = 0));
    txInMonth
      .filter((t) => t.type === "Chi" && t.subType === "tui")
      .forEach((t) => {
        byMember[t.memberId] = (byMember[t.memberId] || 0) + t.amount;
      });
    const maxMember = Math.max(1, ...Object.values(byMember));

    // Chi tiêu theo danh mục (TOÀN BỘ Chi, cả quỹ lẫn túi) + xu hướng 6 tháng
    const catDetail = DB.categoryDetail(start, end);
    const anUong = catDetail.AnUong.total;
    const khac = catDetail.Khac.total;
    const totalCat = catDetail.grandTotal || 1;
    const trendSeries = DB.monthlySpendSeries(UI.reportMonth, 6);

    // Đóng quỹ tháng này: ai đã có giao dịch Thu (không phải đồng bộ) trong tháng
    const paidSet = new Set(
      txInMonth
        .filter((t) => t.type === "Thu" && !t.linkedId)
        .map((t) => t.memberId)
    );

    // Bữa ăn trong tháng
    const meals = DB.mealCountInRange(start, end);
    const maxMeal = Math.max(1, ...Object.values(meals).map((x) => x.total));

    // Bảng tổng hợp mọi thành viên (đã góp / tiền ăn / chi khác / còn lại) trong tháng đang xem
    const ledger = DB.memberLedger(start, end);

    return `
      <div class="card-row" style="margin-bottom:14px">
        <button class="btn" id="repPrevMonth">‹ Tháng trước</button>
        <div style="font-weight:700">${fmtMonthLabel(start)}</div>
        <button class="btn" id="repNextMonth">Tháng sau ›</button>
      </div>

      <div class="section-title-row">
        <span class="section-title" style="margin-bottom:0">Bảng tổng hợp mọi thành viên</span>
        ${DB.state.members.length ? `<button class="btn btn-sm" id="btnExportReport">📄 Xuất báo cáo</button>` : ""}
      </div>
      <div class="card member-summary-card">
        ${
          DB.state.members.length
            ? `<div class="table-scroll">
          <table class="member-summary-table">
            <thead>
              <tr>
                <th>Thành viên</th>
                <th>Đã góp</th>
                <th>Tiền ăn</th>
                <th>Chi khác</th>
                <th>Còn lại</th>
              </tr>
            </thead>
            <tbody>
              ${DB.state.members
                .map((m) => {
                  const row = ledger.perMember[m.id] || {
                    contributed: 0,
                    tienAn: 0,
                    chiKhac: 0,
                    remaining: 0,
                  };
                  const posNeg = row.remaining < 0 ? "neg" : "pos";
                  return `<tr>
                    <td class="msum-name">${esc(m.name)}</td>
                    <td>${fmtVND(row.contributed)}</td>
                    <td>${fmtVND(row.tienAn)}</td>
                    <td>${fmtVND(row.chiKhac)}</td>
                    <td class="msum-remaining ${posNeg}">${fmtVNDSigned(
                    row.remaining
                  )}</td>
                  </tr>`;
                })
                .join("")}
            </tbody>
          </table>
        </div>`
            : emptyState("Chưa có thành viên")
        }
        <div class="hint" style="margin-top:8px">Còn lại = Đã góp − (Tiền ăn + Chi khác). Số dương là còn dư, số âm là đang nợ quỹ.</div>
      </div>

      <div class="section-title">Tổng hợp chi tiêu theo danh mục</div>
      <div class="card">
        <div class="donut-wrap">
          ${donutSVG(
            [
              { label: "Ăn uống / đi chợ", value: anUong, color: "var(--primary)" },
              { label: "Khác", value: khac, color: "var(--gold)" },
            ],
            112
          )}
          <div class="donut-legend">
            <div class="legend-row">
              <div class="legend-dot" style="background:var(--primary)"></div>
              <div class="legend-text">
                <div class="legend-label">Ăn uống / đi chợ</div>
                <div class="legend-value">${fmtVND(anUong)}</div>
              </div>
              <div class="legend-pct">${((anUong / totalCat) * 100).toFixed(
                0
              )}%</div>
            </div>
            <div class="legend-row">
              <div class="legend-dot" style="background:var(--gold)"></div>
              <div class="legend-text">
                <div class="legend-label">Khác</div>
                <div class="legend-value">${fmtVND(khac)}</div>
              </div>
              <div class="legend-pct">${((khac / totalCat) * 100).toFixed(
                0
              )}%</div>
            </div>
          </div>
        </div>
      </div>

      <div class="section-title">Thống kê chi tiết từng mục</div>
      <div class="card">
        <div class="cat-detail-row">
          <div class="cat-detail-top">
            <div class="cat-detail-name">🍜 Ăn uống / đi chợ</div>
            <div class="cat-detail-total">${fmtVND(anUong)}</div>
          </div>
          <div class="cat-detail-meta"><b>${
            catDetail.AnUong.count
          }</b> giao dịch · trung bình <b>${fmtVND(
      catDetail.AnUong.avg
    )}</b>/giao dịch · chiếm <b>${((anUong / totalCat) * 100).toFixed(
      0
    )}%</b> tổng chi</div>
          <div class="bar-track"><div class="bar-fill" style="width:${(
            (anUong / totalCat) *
            100
          ).toFixed(1)}%;background:var(--primary)"></div></div>
        </div>
        <div class="cat-detail-row">
          <div class="cat-detail-top">
            <div class="cat-detail-name">🧾 Khác</div>
            <div class="cat-detail-total">${fmtVND(khac)}</div>
          </div>
          <div class="cat-detail-meta"><b>${
            catDetail.Khac.count
          }</b> giao dịch · trung bình <b>${fmtVND(
      catDetail.Khac.avg
    )}</b>/giao dịch · chiếm <b>${((khac / totalCat) * 100).toFixed(
      0
    )}%</b> tổng chi</div>
          <div class="bar-track"><div class="bar-fill" style="width:${(
            (khac / totalCat) *
            100
          ).toFixed(1)}%;background:var(--gold)"></div></div>
        </div>
      </div>

      <div class="section-title">Xu hướng chi tiêu 6 tháng gần đây</div>
      <div class="card">
        <div class="trend-wrap">${trendBarSVG(trendSeries)}</div>
        <div class="hint" style="margin-top:6px">Cột vàng là tháng đang xem ở trên. Tổng chi mỗi tháng gồm cả chi quỹ lẫn chi túi cá nhân.</div>
      </div>

      <div class="section-title">Chi tiêu theo thành viên</div>
      <div class="card">
        ${
          DB.state.members.length
            ? DB.state.members
                .map(
                  (m) => `
          <div class="bar-row">
            <div class="bar-top"><span>${esc(m.name)}</span><span>${fmtVND(
                    byMember[m.id] || 0
                  )}</span></div>
            <div class="bar-track"><div class="bar-fill" style="width:${(
              ((byMember[m.id] || 0) / maxMember) *
              100
            ).toFixed(1)}%"></div></div>
          </div>`
                )
                .join("")
            : emptyState("Chưa có dữ liệu")
        }
      </div>

      <div class="section-title">Đóng quỹ tháng này</div>
      <div class="card">
        ${
          DB.state.members.length
            ? DB.state.members
                .map(
                  (m) => `
          <div class="list-item">
            <div class="avatar">${esc(initials(m.name))}</div>
            <div class="li-main"><div class="li-title">${esc(m.name)}</div></div>
            <div class="${
              paidSet.has(m.id) ? "tag an" : "tag khac"
            }" style="padding:5px 10px">${
                    paidSet.has(m.id) ? "✓ Đã đóng" : "Chưa đóng"
                  }</div>
          </div>`
                )
                .join("")
            : emptyState("Chưa có dữ liệu")
        }
      </div>

      <div class="section-title">Số bữa ăn trong tháng</div>
      <div class="card">
        ${
          DB.state.members.length
            ? DB.state.members
                .map((m) => {
                  const d = meals[m.id] || { breakfast: 0, lunch: 0, dinner: 0, total: 0 };
                  return `
          <div class="bar-row">
            <div class="bar-top"><span>${esc(
              m.name
            )}</span><span>${d.total} bữa (🌅${d.breakfast} ☀️${d.lunch} 🌙${
                    d.dinner
                  })</span></div>
            <div class="bar-track"><div class="bar-fill" style="width:${(
              (d.total / maxMeal) *
              100
            ).toFixed(1)}%;background:var(--green)"></div></div>
          </div>`;
                })
                .join("")
            : emptyState("Chưa có dữ liệu")
        }
      </div>
    `;
  }

  function wireReportsEvents() {
    document.getElementById("repPrevMonth").onclick = () => {
      UI.reportMonth = shiftMonth(UI.reportMonth, -1);
      render();
    };
    document.getElementById("repNextMonth").onclick = () => {
      UI.reportMonth = shiftMonth(UI.reportMonth, 1);
      render();
    };
    const btnExp = document.getElementById("btnExportReport");
    if (btnExp) btnExp.onclick = () => openExportReportModal();
  }

  /* ================= XUẤT BÁO CÁO CHI TIẾT THÀNH VIÊN ================= */
  function openExportReportModal() {
    const members = DB.state.members;
    if (!members.length) { toast("Chưa có thành viên"); return; }

    // Tạo danh sách tháng có giao dịch (12 tháng gần nhất + tháng hiện tại)
    const monthSet = new Set();
    DB.state.transactions.forEach((t) => { if (t.date) monthSet.add(t.date.slice(0, 7)); });
    const today = todayStr().slice(0, 7);
    for (let i = 0; i < 12; i++) monthSet.add(shiftMonth(today, -i));
    const months = Array.from(monthSet).sort().reverse().slice(0, 24);

    openModal("📄 Xuất báo cáo thành viên",
      `<div class="form-group">
        <label class="form-label">Thành viên</label>
        <select class="form-select" id="rptMember">
          <option value="ALL">— Tất cả thành viên —</option>
          ${members.map((m) => `<option value="${esc(m.id)}">${esc(m.name)}</option>`).join("")}
        </select>
      </div>
      <div class="form-group">
        <label class="form-label">Khoảng thời gian</label>
        <div class="chip-group" id="rptRangeChips">
          <div class="chip active" data-v="month">Theo tháng</div>
          <div class="chip" data-v="now">Đến hiện tại</div>
        </div>
      </div>
      <div id="rptMonthWrap">
        <div class="form-group">
          <label class="form-label">Từ tháng</label>
          <select class="form-select" id="rptFrom">
            ${months.map((mo) => `<option value="${mo}"${mo === UI.reportMonth ? " selected" : ""}>${fmtMonthLabel(mo + "-01")}</option>`).join("")}
          </select>
        </div>
        <div class="form-group">
          <label class="form-label">Đến tháng</label>
          <select class="form-select" id="rptTo">
            ${months.map((mo) => `<option value="${mo}"${mo === UI.reportMonth ? " selected" : ""}>${fmtMonthLabel(mo + "-01")}</option>`).join("")}
          </select>
        </div>
      </div>
      <div class="form-group" style="margin-top:8px;display:flex;gap:8px;flex-wrap:wrap">
        <button class="btn primary" id="btnExcelReport" style="flex:1;min-width:120px">📊 Excel</button>
        <button class="btn" id="btnCsvReport" style="flex:1;min-width:100px">📋 CSV</button>
        <button class="btn" id="btnPdfReport" style="flex:1;min-width:100px;background:#c0392b;color:#fff">📄 PDF</button>
      </div>`,
      {
        onMount: () => {
          let rangeMode = "month";
          document.querySelectorAll("#rptRangeChips .chip").forEach((c) => {
            c.onclick = () => {
              rangeMode = c.dataset.v;
              document.querySelectorAll("#rptRangeChips .chip").forEach((x) => x.classList.remove("active"));
              c.classList.add("active");
              document.getElementById("rptMonthWrap").style.display = rangeMode === "month" ? "block" : "none";
            };
          });

          const getParams = () => {
            const memberId = document.getElementById("rptMember").value;
            let fromMo, toMo;
            if (rangeMode === "now") {
              // Từ giao dịch sớm nhất đến hôm nay
              const allDates = DB.state.transactions.map((t) => t.date).filter(Boolean).sort();
              fromMo = allDates.length ? allDates[0].slice(0, 7) : todayStr().slice(0, 7);
              toMo = todayStr().slice(0, 7);
            } else {
              fromMo = document.getElementById("rptFrom").value;
              toMo   = document.getElementById("rptTo").value;
              if (fromMo > toMo) { toast("Tháng bắt đầu phải ≤ tháng kết thúc"); return null; }
            }
            return { memberId: memberId === "ALL" ? null : memberId, fromMo, toMo };
          };

          document.getElementById("btnExcelReport").onclick = () => {
            const p = getParams(); if (!p) return;
            closeModal();
            generateExcelReport(p.memberId, p.fromMo, p.toMo);
          };
          document.getElementById("btnCsvReport").onclick = () => {
            const p = getParams(); if (!p) return;
            closeModal();
            generateCsvReport(p.memberId, p.fromMo, p.toMo);
          };
          document.getElementById("btnPdfReport").onclick = () => {
            const p = getParams(); if (!p) return;
            closeModal();
            generatePdfReport(p.memberId, p.fromMo, p.toMo);
          };
        },
      }
    );
  }

  function buildReportHtml(memberId, fromMo, toMo) {
    // Xác định danh sách thành viên cần xuất
    const targetMembers = memberId
      ? DB.state.members.filter((m) => m.id === memberId)
      : DB.state.members;
    if (!targetMembers.length) return null;

    const start = fromMo + "-01";
    const [toY, toM] = toMo.split("-").map(Number);
    const end = new Date(toY, toM, 0).toISOString().slice(0, 10);

    const ledger = DB.memberLedger(start, end);
    const txAll = DB.state.transactions.filter((t) => t.date >= start && t.date <= end);

    const mealsByMember = {};
    targetMembers.forEach((m) => { mealsByMember[m.id] = []; });
    Object.keys(DB.state.meals).forEach((key) => {
      const idx = key.lastIndexOf("_");
      const date = key.slice(0, idx).slice(0, 10);
      const mid  = key.slice(idx + 1);
      if (date < start || date > end) return;
      if (!mealsByMember[mid]) return;
      const ms = DB.state.meals[key];
      const slots = ["breakfast","lunch","dinner"].filter((s) => ms[s]);
      if (slots.length) mealsByMember[mid].push({ date, slots });
    });

    const now = new Date().toLocaleString("vi-VN");
    const rangeLabel = fromMo === toMo
      ? fmtMonthLabel(fromMo + "-01")
      : fmtMonthLabel(fromMo + "-01") + " – " + fmtMonthLabel(toMo + "-01");

    // ---- TỔNG QUAN NHÓM ----
    const allMembers = DB.state.members;
    const totalContributed = allMembers.reduce((s, m) => s + (ledger.perMember[m.id]?.contributed || 0), 0);
    const totalTienAn     = allMembers.reduce((s, m) => s + (ledger.perMember[m.id]?.tienAn || 0), 0);
    const totalChiKhac    = allMembers.reduce((s, m) => s + (ledger.perMember[m.id]?.chiKhac || 0), 0);
    const totalRemaining  = allMembers.reduce((s, m) => s + (ledger.perMember[m.id]?.remaining || 0), 0);
    const totalMeals      = allMembers.reduce((s, m) => s + (ledger.perMember[m.id]?.meals || 0), 0);
    const txExpense = txAll.filter((t) => t.type === "Chi" && !t.linkedId);
    const txIncome  = txAll.filter((t) => t.type === "Thu" && !t.linkedId);
    const sumExpense = txExpense.reduce((s, t) => s + num(t.amount), 0);
    const sumIncome  = txIncome.reduce((s, t) => s + num(t.amount), 0);

    // Đếm số ngày có bữa ăn
    const mealDays = new Set(Object.keys(DB.state.meals).map((k) => {
      const idx2 = k.lastIndexOf("_"); return k.slice(0, idx2).slice(0, 10);
    }).filter((d) => d >= start && d <= end));

    // Bảng tổng hợp từng thành viên
    const memberSummaryRows = allMembers.map((m) => {
      const r = ledger.perMember[m.id] || { contributed:0, tienAn:0, chiKhac:0, remaining:0, meals:0 };
      const color = r.remaining < 0 ? "color:#e8402a" : "color:#1a9e4e";
      return `<tr>
        <td style="font-weight:600">${esc(m.name)}</td>
        <td style="text-align:right">${fmtVND(r.contributed)}</td>
        <td style="text-align:right;color:#e8402a">${fmtVND(r.tienAn)}</td>
        <td style="text-align:right;color:#e8402a">${fmtVND(r.chiKhac)}</td>
        <td style="text-align:right;${color};font-weight:700">${fmtVNDSigned(r.remaining)}</td>
        <td style="text-align:center">${r.meals} bữa</td>
      </tr>`;
    }).join("");

    const groupBlock = `
      <div class="member-block" style="border-left:4px solid #034694">
        <h2 style="margin:0 0 14px;color:#034694;font-size:17px">📋 TỔNG QUAN NHÓM – ${esc(rangeLabel)}</h2>
        <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin-bottom:18px">
          <div class="kpi-card"><div class="kpi-val">${allMembers.length}</div><div class="kpi-lbl">Thành viên</div></div>
          <div class="kpi-card"><div class="kpi-val">${mealDays.size} ngày</div><div class="kpi-lbl">Có bữa ăn</div></div>
          <div class="kpi-card"><div class="kpi-val">${totalMeals} bữa</div><div class="kpi-lbl">Tổng suất ăn</div></div>
          <div class="kpi-card" style="border-color:#1a9e4e"><div class="kpi-val" style="color:#1a9e4e">${fmtVND(sumIncome)}</div><div class="kpi-lbl">Tổng thu quỹ</div></div>
          <div class="kpi-card" style="border-color:#e8402a"><div class="kpi-val" style="color:#e8402a">${fmtVND(sumExpense)}</div><div class="kpi-lbl">Tổng chi</div></div>
          <div class="kpi-card" style="border-color:${totalRemaining >= 0 ? '#1a9e4e' : '#e8402a'}"><div class="kpi-val" style="color:${totalRemaining >= 0 ? '#1a9e4e' : '#e8402a'}">${fmtVNDSigned(totalRemaining)}</div><div class="kpi-lbl">Quỹ còn lại</div></div>
        </div>
        <h3 style="margin:0 0 8px;color:#5b6b85;font-size:13px">BẢNG TỔNG HỢP TỪNG THÀNH VIÊN</h3>
        <table class="detail-tbl">
          <thead><tr>
            <th>Thành viên</th>
            <th style="text-align:right">Đã góp</th>
            <th style="text-align:right">Tiền ăn</th>
            <th style="text-align:right">Chi khác</th>
            <th style="text-align:right">Còn lại</th>
            <th style="text-align:center">Bữa ăn</th>
          </tr></thead>
          <tbody>${memberSummaryRows}</tbody>
          <tfoot><tr style="font-weight:700;background:#eef2f9">
            <td>Tổng</td>
            <td style="text-align:right">${fmtVND(totalContributed)}</td>
            <td style="text-align:right;color:#e8402a">${fmtVND(totalTienAn)}</td>
            <td style="text-align:right;color:#e8402a">${fmtVND(totalChiKhac)}</td>
            <td style="text-align:right">${fmtVNDSigned(totalRemaining)}</td>
            <td style="text-align:center">${totalMeals} bữa</td>
          </tr></tfoot>
        </table>
      </div>`;

    const memberBlocks = targetMembers.map((m) => {
      const row = ledger.perMember[m.id] || { contributed: 0, tienAn: 0, chiKhac: 0, remaining: 0, meals: 0 };

      const myTx = txAll.filter((t) => {
        if (t.linkedId) return false;
        if (t.type === "Thu" && t.memberId === m.id) return true;
        if (t.type === "Chi" && t.subType === "tui" && t.memberId === m.id) return true;
        if (t.type === "Chi" && t.subType === "quy") {
          const parts = t.participants && t.participants.length ? t.participants : DB.state.members.map((x) => x.id);
          return parts.includes(m.id);
        }
        return false;
      }).sort((a, b) => a.datetime > b.datetime ? 1 : -1);

      const txRows = myTx.map((t) => {
        const isIncome = t.type === "Thu";
        const catLabel = t.category === "AnUong" ? "Ăn uống" : (t.category || "Khác");
        const subLabel = t.subType === "quy" ? "Quỹ chung" : "Chi túi";
        let amtLabel = isIncome
          ? `+${fmtVND(t.amount)}`
          : (t.type === "Chi" && t.subType === "quy")
            ? (() => {
                const parts = t.participants && t.participants.length ? t.participants : DB.state.members.map((x) => x.id);
                const valid = parts.filter((id) => DB.state.members.find((x) => x.id === id));
                const share = valid.length ? t.amount / valid.length : 0;
                return `-${fmtVND(share)} (phần ${valid.length} người)`;
              })()
            : `-${fmtVND(t.amount)}`;
        const style = isIncome ? "color:#1a9e4e;font-weight:600" : "color:#e8402a";
        return `<tr>
          <td style="white-space:nowrap">${t.date}</td>
          <td>${esc(t.description || catLabel)}</td>
          <td>${isIncome ? "Thu" : "Chi – " + subLabel}</td>
          <td style="text-align:right;${style}">${amtLabel}</td>
        </tr>`;
      }).join("");

      const slotNames = { breakfast: "Sáng", lunch: "Trưa", dinner: "Tối" };
      const sortedMeals = (mealsByMember[m.id] || []).sort((a, b) => a.date > b.date ? 1 : -1);
      const totalSlots = sortedMeals.reduce((s, r) => s + r.slots.length, 0);
      const mealRows = sortedMeals.map((r) => {
          const wd = ["CN","T2","T3","T4","T5","T6","T7"][new Date(r.date + "T00:00:00").getDay()];
          return `<tr>
            <td style="white-space:nowrap">${r.date} (${wd})</td>
            <td>${r.slots.map((s) => slotNames[s]).join(", ")}</td>
            <td style="text-align:center">${r.slots.length} suất</td>
          </tr>`;
        }).join("");

      const posNeg = row.remaining < 0
        ? `<span style="color:#e8402a;font-weight:700">${fmtVNDSigned(row.remaining)}</span>`
        : `<span style="color:#1a9e4e;font-weight:700">${fmtVNDSigned(row.remaining)}</span>`;

      return `
        <div class="member-block">
          <h2 style="margin:0 0 12px;color:#034694;border-bottom:2px solid #034694;padding-bottom:6px">${esc(m.name)}</h2>
          <table class="summary-tbl">
            <tr><td>Đã góp (nộp quỹ + tự ứng)</td><td class="num">${fmtVND(row.contributed)}</td></tr>
            <tr><td>Tiền ăn phân bổ</td><td class="num" style="color:#e8402a">-${fmtVND(row.tienAn)}</td></tr>
            <tr><td>Chi phí khác phân bổ</td><td class="num" style="color:#e8402a">-${fmtVND(row.chiKhac)}</td></tr>
            <tr class="total-row"><td><strong>Còn lại</strong></td><td class="num">${posNeg}</td></tr>
            <tr><td>Số bữa ăn đã tham gia</td><td class="num">${row.meals} bữa</td></tr>
          </table>
          <h3 style="margin:16px 0 8px;color:#5b6b85;font-size:14px">GIAO DỊCH LIÊN QUAN</h3>
          ${myTx.length ? `<table class="detail-tbl">
            <thead><tr><th>Ngày</th><th>Nội dung</th><th>Loại</th><th style="text-align:right">Số tiền</th></tr></thead>
            <tbody>${txRows}</tbody>
          </table>` : `<p style="color:#888;font-size:13px">Không có giao dịch nào trong kỳ.</p>`}
          <h3 style="margin:16px 0 8px;color:#5b6b85;font-size:14px">BỮA ĂN THAM GIA <span style="font-weight:400;color:#888">(${sortedMeals.length} ngày – ${totalSlots} suất)</span></h3>
          ${mealRows ? `<table class="detail-tbl">
            <thead><tr><th>Ngày</th><th>Bữa</th><th style="text-align:center">Số suất</th></tr></thead>
            <tbody>${mealRows}</tbody>
            <tfoot><tr style="font-weight:700;background:#eef2f9"><td colspan="2">Tổng</td><td style="text-align:center">${totalSlots} suất</td></tr></tfoot>
          </table>` : `<p style="color:#888;font-size:13px">Không có dữ liệu bữa ăn trong kỳ.</p>`}
        </div>`;
    }).join("<hr style='margin:28px 0;border:none;border-top:1px solid #dce3f0'>");

    return {
      html: `<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Báo cáo SmartFund – ${esc(rangeLabel)}</title>
<style>
  body{font-family:'Segoe UI',Arial,sans-serif;margin:0;padding:20px 24px;color:#0b1a33;background:#f4f7fc;font-size:14px}
  h1{color:#034694;font-size:20px;margin:0 0 4px}
  .meta{color:#5b6b85;font-size:12px;margin-bottom:28px}
  .member-block{background:#fff;border-radius:12px;padding:20px;margin-bottom:20px;box-shadow:0 1px 6px rgba(0,0,0,.08)}
  .summary-tbl{width:100%;border-collapse:collapse;margin-bottom:4px}
  .summary-tbl td{padding:5px 4px;border-bottom:1px solid #eef2f9}
  .summary-tbl .num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
  .summary-tbl .total-row td{border-top:2px solid #034694;padding-top:7px;font-size:15px}
  .detail-tbl{width:100%;border-collapse:collapse;font-size:13px}
  .detail-tbl th{background:#034694;color:#fff;padding:6px 8px;text-align:left;font-weight:600}
  .detail-tbl td{padding:5px 8px;border-bottom:1px solid #eef2f9}
  .detail-tbl tr:nth-child(even) td{background:#f9fbff}
  .detail-tbl tfoot td{border-top:2px solid #034694}
  h3{text-transform:uppercase;letter-spacing:.04em}
  .kpi-card{background:#f4f7fc;border:1.5px solid #d0daf0;border-radius:8px;padding:12px 14px;text-align:center}
  .kpi-val{font-size:17px;font-weight:700;color:#034694;margin-bottom:4px}
  .kpi-lbl{font-size:11px;color:#5b6b85;text-transform:uppercase;letter-spacing:.05em}
  @media print{body{background:#fff;padding:0} .member-block{box-shadow:none;border:1px solid #ddd;page-break-inside:avoid} .kpi-card{border:1px solid #ccc}}
</style>
</head>
<body>
  <h1>📊 Báo cáo Sổ Ăn Thắng</h1>
  <div class="meta">Kỳ: ${esc(rangeLabel)} &nbsp;|&nbsp; Xuất lúc: ${now}</div>
  ${groupBlock}
  <hr style="margin:20px 0;border:none;border-top:2px solid #dce3f0">
  <h2 style="color:#034694;font-size:16px;margin:0 0 16px">CHI TIẾT TỪNG THÀNH VIÊN</h2>
  ${memberBlocks}
  <div style="margin-top:24px;font-size:11px;color:#aaa;text-align:center">SmartFund – Quỹ chung nhóm</div>
</body>
</html>`,
      fname: memberId
        ? `BaoCao_${(targetMembers[0]?.name || "tv").replace(/\s+/g,"_")}_${fromMo}_${toMo}.html`
        : `BaoCao_TatCa_${fromMo}_${toMo}.html`,
      rangeLabel,
      targetMembers,
    };
  }

  function generateExcelReport(memberId, fromMo, toMo) {
    if (typeof XLSX === "undefined") { toast("Đang tải thư viện, thử lại sau 2 giây"); return; }
    const targetMembers = memberId
      ? DB.state.members.filter((m) => m.id === memberId)
      : DB.state.members;
    if (!targetMembers.length) { toast("Không tìm thấy thành viên"); return; }

    const start = fromMo + "-01";
    const [toY, toM] = toMo.split("-").map(Number);
    const end = new Date(toY, toM, 0).toISOString().slice(0, 10);
    const rangeLabel = fromMo === toMo
      ? fmtMonthLabel(fromMo + "-01")
      : fmtMonthLabel(fromMo + "-01") + " – " + fmtMonthLabel(toMo + "-01");

    const ledger = DB.memberLedger(start, end);
    const txAll = DB.state.transactions.filter((t) => t.date >= start && t.date <= end && !t.linkedId);

    // Bữa ăn theo thành viên
    const mealCount = {}; // mid -> {breakfast, lunch, dinner, total}
    targetMembers.forEach((m) => { mealCount[m.id] = { breakfast:0, lunch:0, dinner:0, total:0 }; });
    Object.keys(DB.state.meals).forEach((key) => {
      const idx = key.lastIndexOf("_");
      const date = key.slice(0, idx).slice(0, 10);
      const mid  = key.slice(idx + 1);
      if (date < start || date > end || !mealCount[mid]) return;
      const ms = DB.state.meals[key];
      ["breakfast","lunch","dinner"].forEach((s) => {
        if (ms[s]) { mealCount[mid][s]++; mealCount[mid].total++; }
      });
    });

    const wb = XLSX.utils.book_new();

    // ── Sheet 1: Tổng hợp ──
    const summaryRows = [
      [`BÁO CÁO SMARTFUND – ${rangeLabel}`],
      [`Xuất lúc: ${new Date().toLocaleString("vi-VN")}`],
      [],
      ["Thành viên", "Đã góp (đ)", "Tiền ăn (đ)", "Chi khác (đ)", "Còn lại (đ)", "Số bữa ăn"],
    ];
    targetMembers.forEach((m) => {
      const r = ledger.perMember[m.id] || { contributed:0, tienAn:0, chiKhac:0, remaining:0, meals:0 };
      summaryRows.push([m.name, r.contributed, r.tienAn, r.chiKhac, r.remaining, mealCount[m.id]?.total || 0]);
    });
    // Dòng tổng
    if (targetMembers.length > 1) {
      summaryRows.push([]);
      summaryRows.push([
        "TỔNG",
        targetMembers.reduce((s,m) => s + (ledger.perMember[m.id]?.contributed||0), 0),
        targetMembers.reduce((s,m) => s + (ledger.perMember[m.id]?.tienAn||0), 0),
        targetMembers.reduce((s,m) => s + (ledger.perMember[m.id]?.chiKhac||0), 0),
        targetMembers.reduce((s,m) => s + (ledger.perMember[m.id]?.remaining||0), 0),
        targetMembers.reduce((s,m) => s + (mealCount[m.id]?.total||0), 0),
      ]);
    }
    const wsSummary = XLSX.utils.aoa_to_sheet(summaryRows);
    // Độ rộng cột
    wsSummary["!cols"] = [{ wch:20 },{ wch:14 },{ wch:14 },{ wch:14 },{ wch:14 },{ wch:12 }];
    XLSX.utils.book_append_sheet(wb, wsSummary, "Tổng hợp");

    // ── Sheet 2: Giao dịch chi tiết ──
    const txRows = [
      ["Ngày", "Nội dung", "Loại", "Danh mục", "Thành viên", "Số tiền (đ)", "Ghi chú"],
    ];
    txAll
      .sort((a,b) => a.datetime > b.datetime ? 1 : -1)
      .forEach((t) => {
        const member = DB.state.members.find((m) => m.id === t.memberId);
        const catLabel = t.category === "AnUong" ? "Ăn uống" : (t.category || "Khác");
        const typeLabel = t.type === "Thu" ? "Thu" : (t.subType === "quy" ? "Chi quỹ" : "Chi túi");
        txRows.push([
          t.date, t.description || catLabel, typeLabel, catLabel,
          member?.name || "", t.type === "Thu" ? t.amount : -t.amount,
          t.participants?.length ? `${t.participants.length} người tham gia` : "",
        ]);
      });
    const wsTx = XLSX.utils.aoa_to_sheet(txRows);
    wsTx["!cols"] = [{ wch:12 },{ wch:28 },{ wch:10 },{ wch:12 },{ wch:16 },{ wch:16 },{ wch:22 }];
    XLSX.utils.book_append_sheet(wb, wsTx, "Giao dịch");

    // ── Sheet 3: Bữa ăn ──
    const mealRows = [
      ["Thành viên", "Bữa sáng", "Bữa trưa", "Bữa tối", "Tổng bữa"],
    ];
    targetMembers.forEach((m) => {
      const mc = mealCount[m.id] || { breakfast:0, lunch:0, dinner:0, total:0 };
      mealRows.push([m.name, mc.breakfast, mc.lunch, mc.dinner, mc.total]);
    });
    const wsMeal = XLSX.utils.aoa_to_sheet(mealRows);
    wsMeal["!cols"] = [{ wch:20 },{ wch:12 },{ wch:12 },{ wch:12 },{ wch:12 }];
    XLSX.utils.book_append_sheet(wb, wsMeal, "Bữa ăn");

    // ── Sheet 4: Chi tiết từng thành viên (mỗi người 1 block) ──
    const detailRows = [];
    targetMembers.forEach((m, idx) => {
      if (idx > 0) detailRows.push([], []); // khoảng cách giữa các thành viên
      detailRows.push([`▶ ${m.name.toUpperCase()}`]);
      detailRows.push(["Ngày", "Nội dung", "Loại", "Số tiền (đ)"]);
      const myTx = txAll.filter((t) => {
        if (t.type === "Thu" && t.memberId === m.id) return true;
        if (t.type === "Chi" && t.subType === "tui" && t.memberId === m.id) return true;
        if (t.type === "Chi" && t.subType === "quy") {
          const parts = t.participants?.length ? t.participants : DB.state.members.map((x) => x.id);
          return parts.includes(m.id);
        }
        return false;
      }).sort((a,b) => a.datetime > b.datetime ? 1 : -1);

      myTx.forEach((t) => {
        const isIncome = t.type === "Thu";
        const catLabel = t.category === "AnUong" ? "Ăn uống" : (t.category || "Khác");
        let amt;
        if (isIncome) {
          amt = t.amount;
        } else if (t.subType === "quy") {
          const parts = t.participants?.length ? t.participants : DB.state.members.map((x) => x.id);
          const valid = parts.filter((id) => DB.state.members.find((x) => x.id === id));
          amt = -(valid.length ? t.amount / valid.length : 0);
        } else {
          amt = -t.amount;
        }
        detailRows.push([
          t.date,
          t.description || catLabel,
          isIncome ? "Thu" : (t.subType === "quy" ? "Chi quỹ" : "Chi túi"),
          amt,
        ]);
      });
      const r = ledger.perMember[m.id] || { contributed:0, tienAn:0, chiKhac:0, remaining:0 };
      detailRows.push(["", "CÒN LẠI", "", r.remaining]);
    });
    const wsDetail = XLSX.utils.aoa_to_sheet(detailRows);
    wsDetail["!cols"] = [{ wch:12 },{ wch:30 },{ wch:12 },{ wch:16 }];
    XLSX.utils.book_append_sheet(wb, wsDetail, "Chi tiết thành viên");

    // Xuất file
    const fname = memberId
      ? `SmartFund_${(targetMembers[0]?.name||"tv").replace(/\s+/g,"_")}_${fromMo}_${toMo}.xlsx`
      : `SmartFund_TatCa_${fromMo}_${toMo}.xlsx`;
    XLSX.writeFile(wb, fname);
    toast("✅ Đã xuất file Excel");
  }

  async function generateAndShareReport(memberId, fromMo, toMo) {
    const result = buildReportHtml(memberId, fromMo, toMo);
    if (!result) { toast("Không tìm thấy thành viên"); return; }
    const { html, fname, rangeLabel, targetMembers } = result;
    const blob = new Blob([html], { type: "text/html;charset=utf-8" });
    const file = new File([blob], fname, { type: "text/html" });
    // Thử Web Share API (Android Chrome, iOS Safari hỗ trợ)
    if (navigator.canShare && navigator.canShare({ files: [file] })) {
      try {
        await navigator.share({
          files: [file],
          title: "Báo cáo SmartFund",
          text: `Báo cáo ${targetMembers.map((m) => m.name).join(", ")} – ${rangeLabel}`,
        });
        return;
      } catch (e) {
        if (e.name === "AbortError") return; // người dùng huỷ
      }
    }
    // Fallback: tải file như cũ
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url; a.download = fname;
    document.body.appendChild(a); a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
    toast("✅ Đã lưu báo cáo");
  }

  function generateCsvReport(memberId, fromMo, toMo) {
    const targetMembers = memberId
      ? DB.state.members.filter((m) => m.id === memberId)
      : DB.state.members;
    if (!targetMembers.length) { toast("Không tìm thấy thành viên"); return; }

    const start = fromMo + "-01";
    const [toY, toM] = toMo.split("-").map(Number);
    const end = new Date(toY, toM, 0).toISOString().slice(0, 10);
    const rangeLabel = fromMo === toMo
      ? fmtMonthLabel(fromMo + "-01")
      : fmtMonthLabel(fromMo + "-01") + " – " + fmtMonthLabel(toMo + "-01");
    const now = new Date().toLocaleString("vi-VN");

    const ledger = DB.memberLedger(start, end);
    const txAll = DB.state.transactions.filter((t) => t.date >= start && t.date <= end && !t.linkedId);

    const mealData = {};
    const mealCount = {};
    targetMembers.forEach((m) => { mealData[m.id] = []; mealCount[m.id] = {breakfast:0,lunch:0,dinner:0,total:0}; });
    Object.keys(DB.state.meals).forEach((key) => {
      const idx = key.lastIndexOf("_");
      const date = key.slice(0, idx).slice(0, 10);
      const mid  = key.slice(idx + 1);
      if (date < start || date > end || !mealData[mid]) return;
      const ms = DB.state.meals[key];
      if (ms.breakfast || ms.lunch || ms.dinner) {
        mealData[mid].push({ date, breakfast: ms.breakfast||false, lunch: ms.lunch||false, dinner: ms.dinner||false });
        ["breakfast","lunch","dinner"].forEach((s) => { if (ms[s]) { mealCount[mid][s]++; mealCount[mid].total++; } });
      }
    });

    const csvEsc = (s) => `"${String(s || "").replace(/"/g, '""')}"`;
    const rows = [];

    rows.push([csvEsc("BÁO CÁO SỔ ĂN THẮNG"), csvEsc(`Kỳ: ${rangeLabel}`), csvEsc(`Xuất: ${now}`)]);
    rows.push([]);

    // Bảng tổng hợp
    rows.push([csvEsc("=== BẢNG TỔNG HỢP ===")]);
    rows.push([csvEsc("Thành viên"), csvEsc("Đã góp (đ)"), csvEsc("Tiền ăn (đ)"), csvEsc("Chi khác (đ)"), csvEsc("Còn lại (đ)"), csvEsc("Tổng bữa"), csvEsc("Sáng"), csvEsc("Trưa"), csvEsc("Tối")]);
    targetMembers.forEach((m) => {
      const r = ledger.perMember[m.id] || { contributed:0, tienAn:0, chiKhac:0, remaining:0 };
      const mc = mealCount[m.id] || { breakfast:0, lunch:0, dinner:0, total:0 };
      rows.push([csvEsc(m.name), r.contributed, r.tienAn, r.chiKhac, r.remaining, mc.total, mc.breakfast, mc.lunch, mc.dinner]);
    });
    rows.push([]);

    // Chi tiết từng thành viên
    targetMembers.forEach((m) => {
      const r = ledger.perMember[m.id] || { contributed:0, tienAn:0, chiKhac:0, remaining:0 };
      rows.push([csvEsc(`=== ${m.name.toUpperCase()} ===`)]);

      rows.push([csvEsc("-- Giao dịch --")]);
      rows.push([csvEsc("Ngày"), csvEsc("Nội dung"), csvEsc("Loại"), csvEsc("Số tiền (đ)"), csvEsc("Ghi chú")]);
      const myTx = txAll.filter((t) => {
        if (t.type === "Thu" && t.memberId === m.id) return true;
        if (t.type === "Chi" && t.subType === "tui" && t.memberId === m.id) return true;
        if (t.type === "Chi" && t.subType === "quy") {
          const parts = t.participants?.length ? t.participants : DB.state.members.map((x) => x.id);
          return parts.includes(m.id);
        }
        return false;
      }).sort((a,b) => a.datetime > b.datetime ? 1 : -1);

      myTx.forEach((t) => {
        const isIncome = t.type === "Thu";
        const catLabel = t.category === "AnUong" ? "Ăn uống" : (t.category || "Khác");
        let amt, note = "";
        if (isIncome) {
          amt = t.amount;
        } else if (t.subType === "quy") {
          const parts = t.participants?.length ? t.participants : DB.state.members.map((x) => x.id);
          const valid = parts.filter((id) => DB.state.members.find((x) => x.id === id));
          amt = -(valid.length ? t.amount / valid.length : 0);
          note = `Chia ${valid.length} người`;
        } else {
          amt = -t.amount;
        }
        rows.push([csvEsc(t.date), csvEsc(t.description || catLabel), csvEsc(isIncome ? "Thu" : (t.subType==="quy"?"Chi quỹ":"Chi túi")), amt, csvEsc(note)]);
      });
      rows.push([csvEsc("Còn lại"), "", "", r.remaining, ""]);
      rows.push([]);

      rows.push([csvEsc("-- Bữa ăn tham gia --")]);
      rows.push([csvEsc("Ngày"), csvEsc("Sáng"), csvEsc("Trưa"), csvEsc("Tối"), csvEsc("Trạng thái")]);
      const md = (mealData[m.id] || []).sort((a,b) => a.date > b.date ? 1 : -1);
      md.forEach((d) => {
        const hasPaid = txAll.some((t) => t.type === "Thu" && t.memberId === m.id && t.date === d.date);
        rows.push([csvEsc(d.date), csvEsc(d.breakfast?"✓":""), csvEsc(d.lunch?"✓":""), csvEsc(d.dinner?"✓":""), csvEsc(!hasPaid?"Chưa nộp tiền":"")]);
      });
      const mc = mealCount[m.id] || { breakfast:0, lunch:0, dinner:0, total:0 };
      rows.push([csvEsc("Tổng"), mc.breakfast, mc.lunch, mc.dinner, ""]);
      rows.push([]);
    });

    const csvContent = "﻿" + rows.map((r) => r.join(",")).join("\r\n");
    const blob = new Blob([csvContent], { type: "text/csv;charset=utf-8" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    const fname = memberId
      ? `SoAn_${(targetMembers[0]?.name||"tv").replace(/\s+/g,"_")}_${fromMo}_${toMo}.csv`
      : `SoAn_TatCa_${fromMo}_${toMo}.csv`;
    a.download = fname;
    document.body.appendChild(a); a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
    toast("✅ Đã xuất file CSV");
  }

  function generatePdfReport(memberId, fromMo, toMo) {
    const result = buildReportHtml(memberId, fromMo, toMo);
    if (!result) { toast("Không có dữ liệu để xuất"); return; }

    // buildReportHtml trả về full HTML page, chỉ cần thêm nút in
    let fullHtml = result.html;
    // Chèn nút In ngay sau <body>
    fullHtml = fullHtml.replace("<body>", `<body>
<div style="text-align:center;padding:12px 0;background:#034694;margin-bottom:12px">
  <button onclick="window.print()" style="background:#fff;color:#034694;border:none;padding:10px 28px;font-size:15px;border-radius:6px;cursor:pointer;font-weight:700">🖨️ In / Lưu PDF</button>
  <span style="color:#fff;font-size:12px;margin-left:16px;opacity:.8">Chọn "Lưu dưới dạng PDF" trong hộp thoại in</span>
</div>`);

    const win = window.open("", "_blank");
    if (!win) { toast("Trình duyệt chặn popup. Vào Cài đặt Chrome → Cho phép popup rồi thử lại."); return; }
    win.document.write(fullHtml);
    win.document.close();
  }

  /* ================= SETTINGS / BACKUP ================= */
  function openSettingsModal() {
    openModal(
      "Cài đặt & Sao lưu",
      `
      <div class="form-group">
        <button class="btn primary block" id="btnExport">⬇️ Xuất dữ liệu (JSON)</button>
      </div>
      <div class="form-group">
        <button class="btn block" id="btnImport">⬆️ Nhập dữ liệu từ file JSON</button>
      </div>
      <div class="form-group">
        <button class="btn danger block" id="btnReset">🗑️ Xoá toàn bộ dữ liệu</button>
      </div>
      <div class="hint">Dữ liệu được lưu trên thiết bị này (localStorage). Hãy xuất file sao lưu định kỳ để không bị mất dữ liệu.</div>
    `,
      {
        onMount: () => {
          document.getElementById("btnExport").onclick = () => {
            DB.download();
            toast("Đã tải file sao lưu");
          };
          document.getElementById("btnImport").onclick = () => {
            document.getElementById("fileImport").click();
          };
          document.getElementById("btnReset").onclick = () => {
            if (
              confirm(
                "Xoá toàn bộ dữ liệu (thành viên, giao dịch, bữa ăn)? Hành động này không thể hoàn tác."
              )
            ) {
              DB.reset();
              closeModal();
              render();
              toast("Đã xoá toàn bộ dữ liệu");
            }
          };
        },
      }
    );
  }

  function wireGlobalImport() {
    const input = document.getElementById("fileImport");
    input.addEventListener("change", (e) => {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = () => {
        try {
          const parsed = JSON.parse(reader.result);
          const incoming = DB.normalizeImported(parsed);
          const mode = confirm(
            `File có ${incoming.members.length} thành viên, ${incoming.transactions.length} giao dịch.\n\nNhấn OK để THAY THẾ toàn bộ dữ liệu hiện tại, hoặc Huỷ để GỘP vào dữ liệu hiện có.`
          );
          if (mode) {
            DB.state = incoming;
          } else {
            mergeState(incoming);
          }
          DB.save();
          closeModal();
          render();
          toast("Nhập dữ liệu thành công");
        } catch (err) {
          toast("File không hợp lệ");
        }
        input.value = "";
      };
      reader.readAsText(file);
    });
  }

  function mergeState(incoming) {
    const existingMemberIds = new Set(DB.state.members.map((m) => m.id));
    incoming.members.forEach((m) => {
      if (!existingMemberIds.has(m.id)) DB.state.members.push(m);
    });
    const existingTxIds = new Set(DB.state.transactions.map((t) => t.id));
    incoming.transactions.forEach((t) => {
      if (!existingTxIds.has(t.id)) DB.state.transactions.push(t);
    });
    Object.keys(incoming.meals).forEach((k) => {
      DB.state.meals[k] = incoming.meals[k];
    });
  }

  /* ================= SHARED HELPERS ================= */
  function emptyState(msg) {
    return `<div class="empty-state">${esc(msg)}</div>`;
  }

  /* ---------------------------------------------------------------- *
   *  INIT
   * ---------------------------------------------------------------- */
  function init() {
    DB.load();
    document.querySelectorAll(".tab-btn").forEach((btn) => {
      btn.onclick = () => setTab(btn.dataset.tab);
    });
    document.getElementById("btnSettings").onclick = openSettingsModal;
    wireGlobalImport();
    setTab("dashboard");
  }

  document.addEventListener("DOMContentLoaded", init);
})();
</script>
